<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DY AI Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#070b16;
  color:#fff;
  font-family:Arial,sans-serif;
}

.wrap{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:14px;
}

.card{
  background:#0e1528;
  border:1px solid #27345b;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}

.title{
  font-size:25px;
  font-weight:900;
}

.sub{
  color:#8996b8;
  font-size:11px;
  margin-top:5px;
}

label{
  display:block;
  color:#8996b8;
  font-size:10px;
  margin-bottom:6px;
}

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #33436e;
  background:#080d1b;
  color:#fff;
  outline:none;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  background:#263b70;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.full{
  width:100%;
}

.row{
  display:flex;
  gap:8px;
}

.row>*{
  flex:1;
}

.stat{
  min-width:0;
  background:#080d1b;
  border:1px solid #202d4e;
  border-radius:12px;
  padding:12px;
}

.statLabel{
  color:#72809f;
  font-size:9px;
}

.statValue{
  margin-top:5px;
  font-size:15px;
  font-weight:900;
  word-break:break-all;
}

.muted{
  color:#7f8cab;
  font-size:11px;
}

.ok{
  color:#55e39b;
}

.bad{
  color:#ff657c;
}

.key{
  margin-top:9px;
  padding:12px;
  border-radius:12px;
  background:#080d1b;
  border:1px solid #202d4e;
}

.keyName{
  font-size:13px;
  font-weight:900;
  word-break:break-all;
}

.keyInfo{
  margin-top:5px;
  color:#71809f;
  font-size:9px;
  word-break:break-all;
}

.keyButtons{
  display:flex;
  gap:7px;
  margin-top:9px;
}

.keyButtons button{
  flex:1;
}

.danger{
  background:#682638;
}

pre{
  margin:10px 0 0;
  padding:12px;
  border-radius:10px;
  background:#080d1b;
  color:#aab5ce;
  font-size:10px;
  white-space:pre-wrap;
  word-break:break-word;
  overflow:auto;
}

#loginBox{
  margin-top:20px;
}

#panel{
  display:none;
}

.message{
  margin-top:9px;
  font-size:11px;
}

.loading{
  color:#7f8cab;
  font-size:11px;
  padding-top:10px;
}
</style>
</head>

<body>

<div class="wrap">

  <!-- HEADER -->

  <div class="card">

    <div class="title">
      DY AI ADMIN
    </div>

    <div class="sub">
      Wingo 30S Control Panel
    </div>

  </div>


  <!-- LOGIN -->

  <div
    class="card"
    id="loginBox"
  >

    <label>
      ADMIN KEY
    </label>

    <input
      id="adminKey"
      type="password"
      autocomplete="off"
      placeholder="Enter admin key"
    >

    <button
      class="full"
      style="margin-top:10px"
      id="loginButton"
    >
      LOGIN
    </button>

    <div
      class="message"
      id="loginMessage"
    ></div>

  </div>


  <!-- MAIN PANEL -->

  <div id="panel">


    <!-- STATUS -->

    <div class="card">

      <div
        style="
          font-size:16px;
          font-weight:900;
        "
      >
        LIVE STATUS
      </div>

      <div
        class="row"
        style="margin-top:10px"
      >

        <div class="stat">

          <div class="statLabel">
            CURRENT ISSUE
          </div>

          <div
            class="statValue"
            id="currentIssue"
          >
            —
          </div>

        </div>

        <div class="stat">

          <div class="statLabel">
            TARGET ISSUE
          </div>

          <div
            class="statValue"
            id="targetIssue"
          >
            —
          </div>

        </div>

      </div>


      <div
        class="row"
        style="margin-top:8px"
      >

        <div class="stat">

          <div class="statLabel">
            FETCHED
          </div>

          <div
            class="statValue"
            id="fetched"
          >
            0
          </div>

        </div>

        <div class="stat">

          <div class="statLabel">
            MODEL
          </div>

          <div class="statValue">
            V8
          </div>

        </div>

      </div>


      <div
        class="message"
        id="serverStatus"
      >
        Checking server...
      </div>

    </div>


    <!-- CREATE KEY -->

    <div class="card">

      <div
        style="
          font-size:16px;
          font-weight:900;
        "
      >
        CREATE ACCESS KEY
      </div>

      <div
        class="muted"
        style="margin-top:5px"
      >
        Empty field = automatic key
      </div>

      <input
        id="newKey"
        style="margin-top:10px"
        placeholder="Custom access key"
        autocomplete="off"
      >

      <button
        class="full"
        style="margin-top:10px"
        id="createButton"
      >
        CREATE KEY
      </button>

      <div
        class="message"
        id="createMessage"
      ></div>

    </div>


    <!-- KEY LIST -->

    <div class="card">

      <div
        style="
          font-size:16px;
          font-weight:900;
        "
      >
        ACCESS KEYS
      </div>

      <div
        class="muted"
        style="margin-top:5px"
      >
        Create, delete and reset device binding.
      </div>

      <div id="keysList">
        <div class="loading">
          Loading keys...
        </div>
      </div>

    </div>


    <!-- SYSTEM TEST -->

    <div class="card">

      <div
        style="
          font-size:16px;
          font-weight:900;
        "
      >
        SYSTEM TEST
      </div>

      <div
        class="row"
        style="margin-top:10px"
      >

        <button id="wingoButton">
          WINGO API
        </button>

        <button id="modelButton">
          MODEL
        </button>

        <button id="refreshButton">
          REFRESH
        </button>

      </div>

      <pre id="testOutput">No test run.</pre>

    </div>


    <!-- LOGOUT -->

    <div class="card">

      <button
        class="full"
        id="logoutButton"
      >
        LOGOUT
      </button>

    </div>

  </div>

</div>


<script>

let ADMIN_KEY = "";


/* =========================================
   ELEMENT
========================================= */

function $(id){
  return document.getElementById(id);
}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================
   LOGIN
========================================= */

$("loginButton").addEventListener(
  "click",
  login
);


$("adminKey").addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){
      login();
    }

  }
);


async function login(){

  const key =
    $("adminKey")
      .value
      .trim();

  if(!key){

    $("loginMessage").innerHTML =
      '<span class="bad">Admin key required.</span>';

    return;
  }


  $("loginButton").disabled =
    true;

  $("loginButton").textContent =
    "CHECKING...";


  try{

    const response =
      await fetch(
        "/api/admin/status?key=" +
        encodeURIComponent(key) +
        "&t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      $("loginMessage").innerHTML =
        '<span class="bad">Invalid admin key.</span>';

      return;
    }


    ADMIN_KEY =
      key;


    sessionStorage.setItem(
      "dy_admin_key",
      key
    );


    $("loginBox").style.display =
      "none";

    $("panel").style.display =
      "block";


    loadStatus();
    loadKeys();


  }catch(error){

    $("loginMessage").innerHTML =
      '<span class="bad">Server connection failed.</span>';

  }finally{

    $("loginButton").disabled =
      false;

    $("loginButton").textContent =
      "LOGIN";
  }

}


/* =========================================
   RESTORE LOGIN
========================================= */

const savedKey =
  sessionStorage.getItem(
    "dy_admin_key"
  );

if(savedKey){

  ADMIN_KEY =
    savedKey;

  checkSavedLogin();

}


async function checkSavedLogin(){

  try{

    const response =
      await fetch(
        "/api/admin/status?key=" +
        encodeURIComponent(
          ADMIN_KEY
        ) +
        "&t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(data.ok){

      $("loginBox").style.display =
        "none";

      $("panel").style.display =
        "block";

      loadStatus();
      loadKeys();

    }else{

      logout();

    }

  }catch{

    /*
      Keep login screen if server
      cannot currently be reached.
    */

  }

}


/* =========================================
   STATUS
========================================= */

async function loadStatus(){

  if(!ADMIN_KEY){
    return;
  }


  try{

    const response =
      await fetch(
        "/api/admin/status?key=" +
        encodeURIComponent(
          ADMIN_KEY
        ) +
        "&t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      logout();
      return;
    }


    $("currentIssue")
      .textContent =
        data.currentIssue || "—";


    $("targetIssue")
      .textContent =
        data.targetIssue || "—";


    $("fetched")
      .textContent =
        data.fetched || 0;


    if(data.error){

      $("serverStatus").innerHTML =
        '<span class="bad">' +
        "● " +
        escapeHtml(data.error) +
        "</span>";

    }else{

      $("serverStatus").innerHTML =
        '<span class="ok">' +
        "● SERVER ONLINE" +
        "</span>";

    }


  }catch(error){

    $("serverStatus").innerHTML =
      '<span class="bad">● CONNECTION ERROR</span>';

  }

}


/* =========================================
   CREATE KEY
========================================= */

$("createButton").addEventListener(
  "click",
  createKey
);


async function createKey(){

  const customKey =
    $("newKey")
      .value
      .trim();


  $("createButton").disabled =
    true;

  $("createButton").textContent =
    "CREATING...";


  try{

    const response =
      await fetch(
        "/api/admin/keys?key=" +
        encodeURIComponent(
          ADMIN_KEY
        ),
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            accessKey:
              customKey
          })
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      $("createMessage").innerHTML =
        '<span class="bad">' +
        escapeHtml(
          data.message ||
          "Could not create key."
        ) +
        "</span>";

      return;
    }


    const created =
      data.key?.access_key ||
      customKey;


    $("createMessage").innerHTML =
      '<span class="ok">Created: <b>' +
      escapeHtml(created) +
      "</b></span>";


    $("newKey").value =
      "";


    loadKeys();


  }catch(error){

    $("createMessage").innerHTML =
      '<span class="bad">Server error.</span>';

  }finally{

    $("createButton").disabled =
      false;

    $("createButton").textContent =
      "CREATE KEY";
  }

}


/* =========================================
   LOAD KEYS
========================================= */

async function loadKeys(){

  if(!ADMIN_KEY){
    return;
  }


  const box =
    $("keysList");


  box.innerHTML =
    '<div class="loading">Loading keys...</div>';


  try{

    const response =
      await fetch(
        "/api/admin/keys?key=" +
        encodeURIComponent(
          ADMIN_KEY
        ) +
        "&t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      logout();
      return;
    }


    if(
      !Array.isArray(data.keys) ||
      data.keys.length === 0
    ){

      box.innerHTML =
        '<div class="loading">No access keys.</div>';

      return;
    }


    box.innerHTML =
      data.keys
        .map(renderKey)
        .join("");


  }catch(error){

    box.innerHTML =
      '<div class="bad" style="margin-top:10px">' +
      "Failed to load keys." +
      "</div>";

  }

}


/* =========================================
   RENDER KEY
========================================= */

function renderKey(key){

  const linked =
    !!key.device_id;


  const status =
    linked
      ? "DEVICE LINKED"
      : "UNUSED";


  return `

    <div class="key">

      <div class="keyName">
        ${escapeHtml(
          key.access_key
        )}
      </div>

      <div class="keyInfo">
        ID:
        ${Number(key.id)}
      </div>

      <div class="keyInfo">
        STATUS:
        <span class="${
          linked
            ? "bad"
            : "ok"
        }">
          ${status}
        </span>
      </div>

      <div class="keyInfo">
        DEVICE:
        ${escapeHtml(
          key.device_id ||
          "Not linked"
        )}
      </div>

      <div class="keyInfo">
        LAST SEEN:
        ${formatDate(
          key.last_seen
        )}
      </div>

      <div class="keyButtons">

        ${
          linked
          ? `
            <button
              onclick="resetDevice(${Number(key.id)})"
            >
              RESET DEVICE
            </button>
          `
          : ""
        }

        <button
          class="danger"
          onclick="deleteKey(${Number(key.id)})"
        >
          DELETE
        </button>

      </div>

    </div>

  `;
}


/* =========================================
   DELETE KEY
========================================= */

async function deleteKey(id){

  const confirmDelete =
    confirm(
      "Delete this access key?"
    );


  if(!confirmDelete){
    return;
  }


  try{

    const response =
      await fetch(
        "/api/admin/keys?key=" +
        encodeURIComponent(
          ADMIN_KEY
        ),
        {
          method:"DELETE",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            id:id
          })
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      alert(
        data.message ||
        "Delete failed."
      );

      return;
    }


    loadKeys();


  }catch(error){

    alert(
      "Server error."
    );

  }

}


/* =========================================
   RESET DEVICE
========================================= */

async function resetDevice(id){

  const confirmReset =
    confirm(
      "Reset device binding for this key?"
    );


  if(!confirmReset){
    return;
  }


  try{

    const response =
      await fetch(
        "/api/admin/reset-device?key=" +
        encodeURIComponent(
          ADMIN_KEY
        ),
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            id:id
          })
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      alert(
        data.message ||
        "Reset failed."
      );

      return;
    }


    loadKeys();


  }catch(error){

    alert(
      "Server error."
    );

  }

}


/* =========================================
   WINGO API TEST
========================================= */

$("wingoButton").addEventListener(
  "click",
  wingoTest
);


async function wingoTest(){

  $("testOutput").textContent =
    "Testing WingoBot API...";


  try{

    const response =
      await fetch(
        "/api/admin/wingo-test?key=" +
        encodeURIComponent(
          ADMIN_KEY
        ) +
        "&t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    $("testOutput").textContent =
      JSON.stringify(
        data,
        null,
        2
      );


  }catch(error){

    $("testOutput").textContent =
      "ERROR: " +
      error.message;

  }

}


/* =========================================
   MODEL TEST
========================================= */

$("modelButton").addEventListener(
  "click",
  modelTest
);


async function modelTest(){

  $("testOutput").textContent =
    "Testing model...";


  try{

    const response =
      await fetch(
        "/api/admin/model-test?key=" +
        encodeURIComponent(
          ADMIN_KEY
        ) +
        "&t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    $("testOutput").textContent =
      JSON.stringify(
        data,
        null,
        2
      );


  }catch(error){

    $("testOutput").textContent =
      "ERROR: " +
      error.message;

  }

}


/* =========================================
   REFRESH
========================================= */

$("refreshButton").addEventListener(
  "click",
  () => {

    loadStatus();
    loadKeys();

  }
);


/* =========================================
   LOGOUT
========================================= */

$("logoutButton").addEventListener(
  "click",
  logout
);


function logout(){

  ADMIN_KEY = "";

  sessionStorage.removeItem(
    "dy_admin_key"
  );

  $("panel").style.display =
    "none";

  $("loginBox").style.display =
    "block";

  $("adminKey").value =
    "";

  $("loginMessage").innerHTML =
    "";

}


/* =========================================
   DATE
========================================= */

function formatDate(value){

  if(!value){
    return "Never";
  }

  const date =
    new Date(
      Number(value)
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "—";
  }


  return date.toLocaleString();
}


/* =========================================
   AUTO REFRESH
========================================= */

setInterval(
  () => {

    if(ADMIN_KEY){

      loadStatus();

    }

  },
  3000
);

</script>

</body>
</html>
