<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DY AI Admin Panel</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#070b16;
  color:#fff;
  font-family:Arial,sans-serif;
}
.wrap{
  max-width:520px;
  margin:auto;
  padding:14px;
}
.card{
  background:#0e1528;
  border:1px solid #27345b;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}
h1{
  margin:0;
  font-size:24px;
}
.muted{
  color:#8592b3;
  font-size:12px;
  margin-top:5px;
}
label{
  display:block;
  color:#8996b8;
  font-size:11px;
  margin-bottom:6px;
}
input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #33436e;
  background:#080d1b;
  color:#fff;
  outline:none;
}
button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  background:#263b70;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}
button:active{transform:scale(.98)}
.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.row>*{
  flex:1;
}
.stat{
  background:#080d1b;
  border:1px solid #202d4e;
  border-radius:12px;
  padding:12px;
}
.stat b{
  display:block;
  font-size:17px;
  margin-top:4px;
}
.key{
  padding:12px;
  margin-top:9px;
  background:#080d1b;
  border:1px solid #202d4e;
  border-radius:12px;
}
.keytop{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
}
.keyname{
  font-weight:900;
  word-break:break-all;
}
.small{
  color:#7e8baa;
  font-size:10px;
  margin-top:5px;
}
.danger{
  background:#6e2635;
}
.ok{color:#55e39b}
.bad{color:#ff667d}
#panel{display:none}
#message{
  margin-top:10px;
  font-size:12px;
  color:#aeb9d4;
}
pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#080d1b;
  padding:12px;
  border-radius:10px;
  font-size:11px;
  color:#aeb9d4;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">
    <h1>DY AI ADMIN</h1>
    <div class="muted">
      Wingo 30S • Control Panel
    </div>
  </div>

  <!-- LOGIN -->

  <div class="card" id="loginBox">

    <label>ADMIN KEY</label>

    <input
      id="adminKey"
      type="password"
      placeholder="Enter admin key"
    >

    <button
      style="width:100%;margin-top:10px"
      onclick="login()"
    >
      LOGIN
    </button>

    <div id="loginMsg"></div>

  </div>


  <!-- PANEL -->

  <div id="panel">

    <div class="card">

      <div class="row">

        <div class="stat">
          <div class="muted">CURRENT</div>
          <b id="currentIssue">—</b>
        </div>

        <div class="stat">
          <div class="muted">TARGET</div>
          <b id="targetIssue">—</b>
        </div>

      </div>

      <div class="row" style="margin-top:8px">

        <div class="stat">
          <div class="muted">FETCHED</div>
          <b id="fetched">0</b>
        </div>

        <div class="stat">
          <div class="muted">MODEL</div>
          <b>V8</b>
        </div>

      </div>

      <div id="serverStatus"
           class="muted"
           style="margin-top:10px">
        Checking server...
      </div>

    </div>


    <!-- KEY CREATE -->

    <div class="card">

      <div style="font-weight:900">
        CREATE ACCESS KEY
      </div>

      <div class="muted">
        Leave empty to generate automatically
      </div>

      <input
        id="newKey"
        style="margin-top:10px"
        placeholder="Custom key (optional)"
      >

      <button
        style="width:100%;margin-top:10px"
        onclick="createKey()"
      >
        CREATE KEY
      </button>

      <div id="createdKey"></div>

    </div>


    <!-- KEYS -->

    <div class="card">

      <div style="font-weight:900">
        ACCESS KEYS
      </div>

      <div class="muted">
        Manage user access
      </div>

      <div id="keysList">
        Loading...
      </div>

    </div>


    <!-- TEST -->

    <div class="card">

      <div style="font-weight:900">
        SYSTEM TEST
      </div>

      <div class="row" style="margin-top:10px">

        <button onclick="wingoTest()">
          WINGO API
        </button>

        <button onclick="modelTest()">
          MODEL
        </button>

        <button onclick="refreshAll()">
          REFRESH
        </button>

      </div>

      <pre id="testOutput">No test run.</pre>

    </div>

  </div>

</div>


<script>

let KEY = "";

const $ = id =>
  document.getElementById(id);


/* =========================
   LOGIN
========================= */

function login(){

  const key =
    $("adminKey").value.trim();

  if(!key){

    $("loginMsg").innerHTML =
      '<div class="bad">Admin key required.</div>';

    return;
  }

  KEY = key;

  checkAdmin();

}


/* =========================
   ADMIN CHECK
========================= */

async function checkAdmin(){

  try{

    const r =
      await fetch(
        "/api/admin/status?key=" +
        encodeURIComponent(KEY) +
        "&t=" + Date.now()
      );

    const data =
      await r.json();

    if(!data.ok){

      KEY = "";

      $("loginMsg").innerHTML =
        '<div class="bad">Invalid admin key.</div>';

      return;
    }

    $("loginBox").style.display =
      "none";

    $("panel").style.display =
      "block";

    loadKeys();
    loadStatus();

  }catch(e){

    $("loginMsg").innerHTML =
      '<div class="bad">Server connection failed.</div>';

  }

}


/* =========================
   STATUS
========================= */

async function loadStatus(){

  try{

    const r =
      await fetch(
        "/api/admin/status?key=" +
        encodeURIComponent(KEY) +
        "&t=" + Date.now()
      );

    const data =
      await r.json();

    if(!data.ok) return;

    $("currentIssue").textContent =
      data.currentIssue || "—";

    $("targetIssue").textContent =
      data.targetIssue || "—";

    $("fetched").textContent =
      data.fetched || 0;

    if(data.error){

      $("serverStatus").innerHTML =
        '<span class="bad">' +
        "ERROR: " +
        escapeHtml(data.error) +
        "</span>";

    }else{

      $("serverStatus").innerHTML =
        '<span class="ok">● SERVER ONLINE</span>';

    }

  }catch(e){

    $("serverStatus").innerHTML =
      '<span class="bad">● OFFLINE</span>';

  }

}


/* =========================
   CREATE KEY
========================= */

async function createKey(){

  const custom =
    $("newKey").value.trim();

  try{

    const r =
      await fetch(
        "/api/admin/keys?key=" +
        encodeURIComponent(KEY),
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            accessKey:custom
          })
        }
      );

    const data =
      await r.json();

    if(!data.ok){

      $("createdKey").innerHTML =
        '<div class="bad" style="margin-top:8px">' +
        escapeHtml(
          data.message || "Failed"
        ) +
        "</div>";

      return;
    }

    $("createdKey").innerHTML =
      `<div class="ok" style="margin-top:10px">
        Created:
        <b>${escapeHtml(
          data.key.access_key
        )}</b>
      </div>`;

    $("newKey").value = "";

    loadKeys();

  }catch(e){

    $("createdKey").innerHTML =
      '<div class="bad">Server error.</div>';

  }

}


/* =========================
   LOAD KEYS
========================= */

async function loadKeys(){

  const box =
    $("keysList");

  try{

    const r =
      await fetch(
        "/api/admin/keys?key=" +
        encodeURIComponent(KEY) +
        "&t=" + Date.now()
      );

    const data =
      await r.json();

    if(!data.ok){

      box.innerHTML =
        '<div class="bad">Unauthorized</div>';

      return;
    }

    if(!data.keys.length){

      box.innerHTML =
        '<div class="muted" style="margin-top:10px">' +
        "No access keys." +
        "</div>";

      return;
    }

    box.innerHTML =
      data.keys.map(k=>{

        const device =
          k.device_id
            ? "DEVICE LINKED"
            : "UNUSED";

        return `
          <div class="key">

            <div class="keytop">

              <div class="keyname">
                ${escapeHtml(k.access_key)}
              </div>

              <button
                class="danger"
                onclick="deleteKey(${Number(k.id)})"
              >
                DELETE
              </button>

            </div>

            <div class="small">
              ID: ${Number(k.id)}
            </div>

            <div class="small">
              STATUS:
              <span class="${
                k.device_id
                  ? "bad"
                  : "ok"
              }">
                ${device}
              </span>
            </div>

            <div class="small">
              DEVICE:
              ${escapeHtml(
                k.device_id || "Not linked"
              )}
            </div>

            <div class="small">
              LAST SEEN:
              ${formatTime(k.last_seen)}
            </div>

            ${
              k.device_id
              ? `
                <button
                  style="margin-top:8px"
                  onclick="resetDevice(${Number(k.id)})"
                >
                  RESET DEVICE
                </button>
              `
              : ""
            }

          </div>
        `;

      }).join("");

  }catch(e){

    box.innerHTML =
      '<div class="bad">Failed to load keys.</div>';

  }

}


/* =========================
   DELETE
========================= */

async function deleteKey(id){

  if(!confirm(
    "Delete this access key?"
  )) return;

  try{

    const r =
      await fetch(
        "/api/admin/keys?key=" +
        encodeURIComponent(KEY),
        {
          method:"DELETE",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({id})
        }
      );

    const data =
      await r.json();

    if(!data.ok){

      alert(
        data.message ||
        "Delete failed"
      );

      return;
    }

    loadKeys();

  }catch(e){

    alert("Server error.");

  }

}


/* =========================
   RESET DEVICE
========================= */

async function resetDevice(id){

  if(!confirm(
    "Reset device binding for this key?"
  )) return;

  try{

    const r =
      await fetch(
        "/api/admin/reset-device?key=" +
        encodeURIComponent(KEY),
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({id})
        }
      );

    const data =
      await r.json();

    if(!data.ok){

      alert(
        data.message ||
        "Reset failed"
      );

      return;
    }

    loadKeys();

  }catch(e){

    alert("Server error.");

  }

}


/* =========================
   WINGO TEST
========================= */

async function wingoTest(){

  $("testOutput").textContent =
    "Testing WingoBot API...";

  try{

    const r =
      await fetch(
        "/api/admin/wingo-test?key=" +
        encodeURIComponent(KEY) +
        "&t=" + Date.now()
      );

    const data =
      await r.json();

    $("testOutput").textContent =
      JSON.stringify(
        data,
        null,
        2
      );

  }catch(e){

    $("testOutput").textContent =
      "ERROR: " + e.message;

  }

}


/* =========================
   MODEL TEST
========================= */

async function modelTest(){

  $("testOutput").textContent =
    "Testing model...";

  try{

    const r =
      await fetch(
        "/api/admin/model-test?key=" +
        encodeURIComponent(KEY) +
        "&t=" + Date.now()
      );

    const data =
      await r.json();

    $("testOutput").textContent =
      JSON.stringify(
        data,
        null,
        2
      );

  }catch(e){

    $("testOutput").textContent =
      "ERROR: " + e.message;

  }

}


/* =========================
   REFRESH
========================= */

function refreshAll(){

  loadStatus();
  loadKeys();

}


/* =========================
   HELPERS
========================= */

function formatTime(ms){

  if(!ms) return "Never";

  const d =
    new Date(Number(ms));

  if(isNaN(d.getTime())){
    return "—";
  }

  return d.toLocaleString();

}

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   AUTO REFRESH
========================= */

setInterval(()=>{

  if(KEY){

    loadStatus();

  }

},3000);

</script>

</body>
</html>
