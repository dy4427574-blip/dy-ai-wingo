<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>DY AI • Admin</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top,#1a2440,#070910 55%,#030408);
  color:#fff;
}

.container{
  width:min(900px,92%);
  margin:auto;
  padding:30px 0;
}

.header{
  padding:22px;
  border-radius:22px;
  background:rgba(15,20,32,.9);
  border:1px solid rgba(255,255,255,.1);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:900;
}

.logo span{
  color:#00eaff;
}

.panel{
  margin-top:20px;
  padding:25px;
  border-radius:22px;
  background:rgba(12,17,29,.9);
  border:1px solid rgba(255,255,255,.1);
}

h1{
  font-size:25px;
}

h2{
  font-size:18px;
  margin-bottom:17px;
}

.input{
  width:100%;
  padding:15px;
  border-radius:13px;
  border:1px solid #303a4e;
  background:#080d17;
  color:#fff;
  outline:none;
  margin-top:10px;
}

.button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:15px;
  margin-top:12px;
  font-weight:900;
  cursor:pointer;
  background:#00c9e8;
  color:#001014;
}

.status{
  margin-top:15px;
  padding:15px;
  border-radius:13px;
  background:#111827;
  color:#aeb9ca;
  line-height:1.5;
}

.hidden{
  display:none;
}

.statgrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:15px;
}

.stat{
  padding:17px;
  border-radius:15px;
  background:#101725;
}

.label{
  font-size:11px;
  color:#7f8ca3;
  text-transform:uppercase;
}

.value{
  margin-top:7px;
  font-size:20px;
  font-weight:900;
}

.logout{
  background:#222a38;
  color:#fff;
}

.link{
  display:block;
  margin-top:15px;
  text-align:center;
  color:#58ddff;
  text-decoration:none;
}

@media(max-width:600px){

  .statgrid{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">
      DY <span>AI</span> ADMIN
    </div>

    <div>
      1-MIN
    </div>

  </div>


  <!-- LOGIN -->

  <div id="loginPanel" class="panel">

    <h1>Admin Login</h1>

    <p style="margin-top:8px;color:#8995a9">
      Enter your server-side admin key.
    </p>

    <input
      id="adminKey"
      class="input"
      type="password"
      placeholder="Admin Key"
      autocomplete="off"
    >

    <button
      class="button"
      onclick="login()">
      LOGIN
    </button>

    <div
      id="loginStatus"
      class="status">
    </div>

  </div>


  <!-- DASHBOARD -->

  <div
    id="dashboard"
    class="hidden">

    <div class="panel">

      <h2>System Status</h2>

      <div class="statgrid">

        <div class="stat">

          <div class="label">
            Server
          </div>

          <div
            id="serverStatus"
            class="value">
            —
          </div>

        </div>


        <div class="stat">

          <div class="label">
            API
          </div>

          <div
            id="apiStatus"
            class="value">
            —
          </div>

        </div>


        <div class="stat">

          <div class="label">
            Game
          </div>

          <div class="value">
            1 MIN
          </div>

        </div>

      </div>

      <button
        class="button"
        onclick="checkSystem()">
        CHECK SYSTEM
      </button>

      <button
        class="button logout"
        onclick="logout()">
        LOGOUT
      </button>

    </div>


    <div class="panel">

      <h2>Live API Information</h2>

      <div class="status">

        <div>
          Endpoint:
        </div>

        <div style="margin-top:6px;color:#58ddff">
          WingoBot 1-Minute Game History
        </div>

        <br>

        <div>
          Token:
          <strong>
            Server-side only
          </strong>
        </div>

      </div>

    </div>


    <a
      href="/prediction"
      class="link">
      ← Open Prediction Dashboard
    </a>

  </div>

</div>


<script>

function $(id){

  return document.getElementById(id);

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const key =
    $("adminKey").value.trim();

  if(!key){

    $("loginStatus").textContent =
      "Please enter admin key.";

    return;

  }

  $("loginStatus").textContent =
    "Checking...";

  try{

    const response =
      await fetch(
        "/api/admin/check",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            key
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok || !data.success){

      $("loginStatus").textContent =
        data.error ||
        "Invalid admin key.";

      return;

    }

    sessionStorage.setItem(
      "dy_admin_auth",
      "1"
    );

    $("loginPanel")
      .classList
      .add("hidden");

    $("dashboard")
      .classList
      .remove("hidden");

    checkSystem();

  }catch(error){

    $("loginStatus").textContent =
      "Server connection failed.";

  }

}


/* =====================================================
   SYSTEM CHECK
===================================================== */

async function checkSystem(){

  try{

    const response =
      await fetch(
        "/api/health",
        {
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    $("serverStatus").textContent =
      data.success
        ? "ONLINE"
        : "OFFLINE";

    $("apiStatus").textContent =
      data.apiConfigured
        ? "CONFIGURED"
        : "NOT SET";

  }catch(error){

    $("serverStatus").textContent =
      "OFFLINE";

    $("apiStatus").textContent =
      "ERROR";

  }

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

  sessionStorage.removeItem(
    "dy_admin_auth"
  );

  location.reload();

}


/* =====================================================
   RESTORE SESSION UI
===================================================== */

if(
  sessionStorage.getItem(
    "dy_admin_auth"
  ) === "1"
){

  $("loginPanel")
    .classList
    .add("hidden");

  $("dashboard")
    .classList
    .remove("hidden");

  checkSystem();

}

</script>

</body>

</html>
