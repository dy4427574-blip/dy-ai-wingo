<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>DY AI Admin Panel</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  min-height:100vh;

  background:
    radial-gradient(
      circle at top,
      #111827,
      #05070d 50%,
      #020308
    );

  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}


.container{

  width:100%;

  max-width:520px;

  margin:auto;

  padding:20px;

}


.header{

  text-align:center;

  margin:25px 0;

}


.header h1{

  font-size:27px;

  font-weight:900;

}


.header p{

  margin-top:8px;

  font-size:11px;

  opacity:.5;

}


.card{

  background:
    linear-gradient(
      145deg,
      rgba(18,24,38,.98),
      rgba(7,10,18,.98)
    );

  border:
    1px solid
    rgba(120,140,180,.2);

  border-radius:20px;

  padding:20px;

  margin-bottom:15px;

}


.label{

  font-size:11px;

  letter-spacing:1px;

  opacity:.55;

  margin-bottom:9px;

}


input{

  width:100%;

  padding:14px;

  border-radius:12px;

  border:
    1px solid
    #30394c;

  background:#080b13;

  color:#fff;

  outline:none;

  font-size:14px;

}


input:focus{

  border-color:#667da5;

}


button{

  width:100%;

  padding:14px;

  margin-top:12px;

  border:0;

  border-radius:12px;

  background:#ffffff;

  color:#05070d;

  font-size:14px;

  font-weight:900;

  cursor:pointer;

}


button:active{

  transform:scale(.98);

}


.result{

  margin-top:15px;

  padding:14px;

  border-radius:12px;

  text-align:center;

  font-weight:800;

  font-size:13px;

}


.success{

  background:
    rgba(50,255,130,.08);

  border:
    1px solid
    rgba(50,255,130,.2);

  color:#62ff9a;

}


.error{

  background:
    rgba(255,70,70,.08);

  border:
    1px solid
    rgba(255,70,70,.2);

  color:#ff6b6b;

}


.info{

  background:
    rgba(100,140,255,.08);

  border:
    1px solid
    rgba(100,140,255,.2);

  color:#9db5ff;

}


.stat{

  display:flex;

  justify-content:
    space-between;

  align-items:center;

  padding:13px 0;

  border-bottom:
    1px solid
    rgba(255,255,255,.06);

  font-size:13px;

}


.stat:last-child{

  border-bottom:0;

}


.value{

  font-weight:900;

}


.live{

  color:#62ff9a;

}


.bad{

  color:#ff6b6b;

}


.footer{

  text-align:center;

  margin-top:20px;

  font-size:10px;

  opacity:.35;

}

</style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <h1>
      DY AI ADMIN
    </h1>

    <p>
      LIVE PREDICTION CONTROL PANEL
    </p>

  </div>



  <!-- LOGIN -->

  <div
    id="loginCard"
    class="card"
  >

    <div class="label">
      ADMIN KEY
    </div>


    <input
      id="adminKey"
      type="password"
      placeholder="Enter admin key"
      autocomplete="off"
    >


    <button
      onclick="login()"
    >
      LOGIN
    </button>


    <div
      id="loginResult"
    >
    </div>

  </div>



  <!-- PANEL -->

  <div
    id="panel"
    style="display:none"
  >


    <!-- SOURCE STATUS -->

    <div class="card">

      <div class="label">
        API STATUS
      </div>


      <div class="stat">

        <span>
          Source
        </span>

        <span
          id="source"
          class="value"
        >
          --
        </span>

      </div>


      <div class="stat">

        <span>
          Method
        </span>

        <span
          id="method"
          class="value"
        >
          --
        </span>

      </div>


      <div class="stat">

        <span>
          Token
        </span>

        <span
          id="token"
          class="value"
        >
          --
        </span>

      </div>


      <div class="stat">

        <span>
          Server
        </span>

        <span
          id="serverStatus"
          class="value"
        >
          --
        </span>

      </div>

    </div>



    <!-- LIVE DATA -->

    <div class="card">

      <div class="label">
        LIVE DATA
      </div>


      <div class="stat">

        <span>
          Current Period
        </span>

        <span
          id="currentPeriod"
          class="value"
        >
          --
        </span>

      </div>


      <div class="stat">

        <span>
          Prediction Period
        </span>

        <span
          id="nextPeriod"
          class="value"
        >
          --
        </span>

      </div>


      <div class="stat">

        <span>
          Analysis
        </span>

        <span
          id="analysis"
          class="value"
        >
          --
        </span>

      </div>


      <div class="stat">

        <span>
          Prediction
        </span>

        <span
          id="prediction"
          class="value"
        >
          --
        </span>

      </div>

    </div>



    <!-- REFRESH -->

    <div class="card">

      <div class="label">
        CONTROL
      </div>


      <button
        onclick="refreshNow()"
      >
        REFRESH STATUS
      </button>


      <button
        onclick="logout()"
      >
        LOGOUT
      </button>

    </div>


  </div>



  <div class="footer">
    DY AI • Server-side API configuration
  </div>


</div>



<script>

/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const key =
    document
      .getElementById(
        "adminKey"
      )
      .value
      .trim();


  const result =
    document
      .getElementById(
        "loginResult"
      );


  if(!key){

    result.className =
      "result error";

    result.textContent =
      "Enter admin key";

    return;

  }


  try{

    const response =
      await fetch(
        "/api/admin/check?key=" +
        encodeURIComponent(
          key
        ) +
        "&_=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      data.success
    ){

      sessionStorage.setItem(
        "dy_admin",
        "1"
      );


      document
        .getElementById(
          "loginCard"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "panel"
        )
        .style.display =
        "block";


      loadStatus();

    }

    else{

      result.className =
        "result error";

      result.textContent =
        "INVALID ADMIN KEY";

    }

  }

  catch(error){

    result.className =
      "result error";

    result.textContent =
      "SERVER CONNECTION ERROR";

  }

}


/* =====================================================
   LOAD STATUS
===================================================== */

async function loadStatus(){

  try{

    const healthResponse =
      await fetch(
        "/api/health?_=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    const health =
      await healthResponse.json();


    document
      .getElementById(
        "source"
      )
      .textContent =
      health.source ||
      "--";


    document
      .getElementById(
        "method"
      )
      .textContent =
      health.method ||
      "--";


    const token =
      document
        .getElementById(
          "token"
        );


    token.textContent =
      health.tokenConfigured
        ? "CONFIGURED"
        : "NOT CONFIGURED";


    token.className =
      "value " +
      (
        health.tokenConfigured
          ? "live"
          : "bad"
      );


    const serverStatus =
      document
        .getElementById(
          "serverStatus"
        );


    serverStatus.textContent =
      health.status ||
      "--";


    serverStatus.className =
      "value " +
      (
        health.status ===
        "LIVE"
          ? "live"
          : "bad"
      );


    /* LIVE STATE */

    const stateResponse =
      await fetch(
        "/api/state?_=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    const state =
      await stateResponse.json();


    document
      .getElementById(
        "currentPeriod"
      )
      .textContent =
      state.currentPeriod ||
      "--";


    document
      .getElementById(
        "nextPeriod"
      )
      .textContent =
      state.nextPeriod ||
      "--";


    const analysis =
      state.analysis ||
      {};


    document
      .getElementById(
        "analysis"
      )
      .textContent =
      analysis.active
        ? "RUNNING " +
          analysis.remaining +
          "s"
        : "READY";


    document
      .getElementById(
        "prediction"
      )
      .textContent =
      analysis.prediction ||
      "WAITING";


  }

  catch(error){

    document
      .getElementById(
        "serverStatus"
      )
      .textContent =
      "ERROR";

  }

}


/* =====================================================
   REFRESH
===================================================== */

function refreshNow(){

  loadStatus();

}


/* =====================================================
   AUTO REFRESH
===================================================== */

let autoRefresh =
  null;


function startAutoRefresh(){

  if(autoRefresh){

    clearInterval(
      autoRefresh
    );

  }


  autoRefresh =
    setInterval(
      loadStatus,
      1000
    );

}


function logout(){

  sessionStorage.removeItem(
    "dy_admin"
  );


  location.reload();

}


/* =====================================================
   AUTO LOGIN SESSION
===================================================== */

if(
  sessionStorage.getItem(
    "dy_admin"
  ) === "1"
){

  document
    .getElementById(
      "loginCard"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "panel"
    )
    .style.display =
    "block";


  loadStatus();

}


/* =====================================================
   START
===================================================== */

startAutoRefresh();

</script>


</body>

</html>
