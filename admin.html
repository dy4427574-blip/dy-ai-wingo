<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>DY AI Admin</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  padding:15px;
  color:#fff;
  background:
    radial-gradient(
      circle at 50% -10%,
      #20294b,
      #080b14 45%,
      #020306
    );
  font-family:Arial,sans-serif;
}

.wrap{
  width:100%;
  max-width:900px;
  margin:auto;
}

header{
  margin-bottom:18px;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:7px;
}

.sub{
  margin-top:7px;
  color:#68738e;
  font-size:10px;
  letter-spacing:4px;
}

.card{
  margin-bottom:15px;
  padding:20px;
  border:1px solid #202b45;
  border-radius:24px;
  background:#080d19;
}

.title{
  margin-bottom:15px;
  color:#77819c;
  font-size:10px;
  font-weight:900;
  letter-spacing:4px;
}

input{
  width:100%;
  margin-bottom:10px;
  padding:14px;
  outline:none;
  border:1px solid #293652;
  border-radius:13px;
  color:#fff;
  background:#050914;
}

button{
  padding:12px 16px;
  border:0;
  border-radius:12px;
  color:#fff;
  background:#ff3c68;
  font-weight:900;
  cursor:pointer;
}

button.gray{
  background:#202b42;
}

button.red{
  background:#8e203d;
}

.login{
  max-width:500px;
  margin:80px auto;
}

.hide{
  display:none!important;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:10px;
}

.stat{
  padding:16px;
  border:1px solid #1c2942;
  border-radius:14px;
  background:#060a13;
}

.stat small{
  display:block;
  margin-bottom:7px;
  color:#68738e;
  font-size:9px;
}

.stat b{
  font-size:19px;
}

.row{
  display:flex;
  gap:9px;
  margin-bottom:12px;
}

.row input{
  margin:0;
}

.key{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:14px;
  margin-bottom:9px;
  border:1px solid #1d2941;
  border-radius:14px;
  background:#060a13;
}

.keyText{
  min-width:0;
}

.keyName{
  font-weight:900;
  word-break:break-all;
}

.keyDevice{
  margin-top:6px;
  color:#68738e;
  font-size:10px;
  word-break:break-all;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

pre{
  max-height:350px;
  overflow:auto;
  padding:15px;
  border-radius:14px;
  background:#03050a;
  color:#aeb9d1;
  font-size:11px;
  white-space:pre-wrap;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
}

th,
td{
  padding:10px 6px;
  border-bottom:1px solid #1b263c;
  text-align:left;
}

th{
  color:#6f7a95;
}

.good{
  color:#2cff9f;
}

.bad{
  color:#ff617f;
}

@media(max-width:650px){

  .grid{
    grid-template-columns:
      1fr 1fr;
  }

  .key{
    align-items:flex-start;
    flex-direction:column;
  }

  .row{
    flex-direction:column;
  }

}

</style>

</head>

<body>

<div class="wrap">

<header>

<div class="logo">
DY AI
</div>

<div class="sub">
WINGO ADMIN PANEL
</div>

</header>


<!-- LOGIN -->

<div
  id="login"
  class="card login"
>

<div class="title">
ADMIN LOGIN
</div>

<input
  id="adminKey"
  type="password"
  placeholder="ADMIN KEY"
>

<button
  onclick="adminLogin()"
>
LOGIN
</button>

</div>


<!-- PANEL -->

<div
  id="panel"
  class="hide"
>


<div class="card">

<div class="title">
LIVE STATUS
</div>

<div class="grid">

<div class="stat">
<small>LIVE</small>
<b id="live">—</b>
</div>

<div class="stat">
<small>CURRENT PERIOD</small>
<b id="period">—</b>
</div>

<div class="stat">
<small>HISTORY</small>
<b id="historyCount">0</b>
</div>

<div class="stat">
<small>MODEL</small>
<b id="model">—</b>
</div>

</div>

</div>


<div class="card">

<div class="title">
STATISTICS
</div>

<div class="grid">

<div class="stat">
<small>PREDICTIONS</small>
<b id="predictions">0</b>
</div>

<div class="stat">
<small>SETTLED</small>
<b id="settled">0</b>
</div>

<div class="stat">
<small>WINS</small>
<b id="wins" class="good">0</b>
</div>

<div class="stat">
<small>LOSSES</small>
<b id="losses" class="bad">0</b>
</div>

</div>

</div>


<div class="card">

<div class="title">
CREATE ACCESS KEY
</div>

<div class="row">

<input
  id="newKey"
  placeholder="Leave blank = AUTO KEY"
>

<button
  onclick="createKey()"
>
CREATE
</button>

</div>

</div>


<div class="card">

<div class="title">
ACCESS KEYS
</div>

<div
  id="keys"
>
Loading...
</div>

</div>


<div class="card">

<div class="title">
LIVE TEST
</div>

<div class="actions">

<button
  onclick="liveTest()"
>
TEST API
</button>

<button
  class="gray"
  onclick="refreshAll()"
>
REFRESH
</button>

</div>

<br>

<pre id="liveOutput">
No test yet.
</pre>

</div>


<div class="card">

<div class="title">
PREDICTION HISTORY
</div>

<div style="overflow:auto">

<table>

<thead>

<tr>

<th>ISSUE</th>

<th>PRED</th>

<th>CONF</th>

<th>ACTUAL</th>

<th>TIME</th>

</tr>

</thead>

<tbody
  id="predictionTable"
>
</tbody>

</table>

</div>

</div>


</div>


<script>

let ADMIN =
  localStorage.getItem(
    "DY_AI_ADMIN_KEY"
  ) || "";


function $(id){

  return document.getElementById(
    id
  );

}


function showPanel(){

  $("login")
    .classList.add(
      "hide"
    );

  $("panel")
    .classList.remove(
      "hide"
    );

}


function showLogin(){

  $("login")
    .classList.remove(
      "hide"
    );

  $("panel")
    .classList.add(
      "hide"
    );

}


async function api(
  url,
  options={}
){

  options.headers =
    Object.assign(
      {},
      options.headers || {},
      {
        "X-Admin-Key":
          ADMIN
      }
    );

  const r =
    await fetch(
      url,
      options
    );

  const data =
    await r.json();

  if(
    r.status === 401
  ){

    localStorage.removeItem(
      "DY_AI_ADMIN_KEY"
    );

    ADMIN = "";

    showLogin();

    throw new Error(
      "ADMIN KEY INVALID"
    );
  }

  return data;
}


async function adminLogin(){

  const key =
    $("adminKey")
      .value
      .trim();

  if(!key){

    alert(
      "Admin key enter karo."
    );

    return;
  }

  ADMIN =
    key;

  try{

    const data =
      await api(
        "/api/admin/status"
      );

    if(
      !data.ok
    ){
      throw new Error(
        "INVALID"
      );
    }

    localStorage.setItem(
      "DY_AI_ADMIN_KEY",
      ADMIN
    );

    showPanel();

    refreshAll();

  }catch(e){

    ADMIN = "";

    alert(
      "Admin key invalid."
    );

  }

}


async function refreshAll(){

  try{

    const status =
      await api(
        "/api/admin/status"
      );

    renderStatus(
      status
    );

    const keys =
      await api(
        "/api/admin/keys"
      );

    renderKeys(
      keys.keys || []
    );

    const predictions =
      await api(
        "/api/admin/predictions"
      );

    renderPredictions(
      predictions.predictions ||
      []
    );

  }catch(e){

    console.log(e);

  }

}


function renderStatus(
  data
){

  $("live")
    .textContent =
    data.live?.ok
      ? "ONLINE"
      : "OFFLINE";

  $("period")
    .textContent =
    data.live?.currentIssue ||
    "—";

  $("historyCount")
    .textContent =
    data.live?.history ||
    0;

  $("predictions")
    .textContent =
    data.stats?.predictions ||
    0;

  $("settled")
    .textContent =
    data.stats?.settled ||
    0;

  $("wins")
    .textContent =
    data.stats?.wins ||
    0;

  $("losses")
    .textContent =
    data.stats?.losses ||
    0;
}


function renderKeys(
  keys
){

  const box =
    $("keys");

  box.innerHTML = "";

  if(!keys.length){

    box.textContent =
      "No keys.";

    return;
  }

  keys.forEach(
    item => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "key";

      const last =
        Number(
          item.last_seen || 0
        );

      const online =
        last &&
        Date.now() -
          last <
          120000;

      div.innerHTML = `
        <div class="keyText">
          <div class="keyName">
            ${escapeHtml(
              item.access_key
            )}
          </div>

          <div class="keyDevice">
            Device:
            ${escapeHtml(
              item.device_id ||
              "Not linked"
            )}
            <br>
            Status:
            <span class="${
              online
                ? "good"
                : "bad"
            }">
              ${
                online
                  ? "ONLINE"
                  : "OFFLINE"
              }
            </span>
          </div>
        </div>

        <div class="actions">

          <button
            class="gray"
            onclick="resetKey('${escapeAttr(
              item.access_key
            )}')"
          >
            RESET DEVICE
          </button>

          <button
            class="red"
            onclick="deleteKey('${escapeAttr(
              item.access_key
            )}')"
          >
            DELETE
          </button>

        </div>
      `;

      box.appendChild(
        div
      );

    }
  );

}


function escapeHtml(
  text
){

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


function escapeAttr(
  text
){

  return String(text)
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    );
}


async function createKey(){

  const key =
    $("newKey")
      .value
      .trim();

  try{

    const data =
      await api(
        "/api/admin/keys",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              key:key
            })
        }
      );

    if(!data.ok){

      alert(
        data.error ||
        "KEY CREATE FAILED"
      );

      return;
    }

    $("newKey")
      .value = "";

    alert(
      "New key: " +
      data.key.access_key
    );

    refreshAll();

  }catch(e){

    alert(
      e.message
    );

  }

}


async function resetKey(
  key
){

  if(
    !confirm(
      "Is key ka device reset karna hai?"
    )
  ){
    return;
  }

  try{

    const data =
      await api(
        "/api/admin/reset-device",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              key:key
            })
        }
      );

    if(!data.ok){

      alert(
        data.error
      );

      return;
    }

    alert(
      "Device reset ho gaya."
    );

    refreshAll();

  }catch(e){

    alert(
      e.message
    );

  }

}


async function deleteKey(
  key
){

  if(
    !confirm(
      "Key permanently delete karni hai?"
    )
  ){
    return;
  }

  try{

    const data =
      await api(
        "/api/admin/delete-key",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              key:key
            })
        }
      );

    if(!data.ok){

      alert(
        data.error
      );

      return;
    }

    refreshAll();

  }catch(e){

    alert(
      e.message
    );

  }

}


async function liveTest(){

  $("liveOutput")
    .textContent =
    "Testing...";

  try{

    const data =
      await api(
        "/api/admin/live-test"
      );

    $("liveOutput")
      .textContent =
      JSON.stringify(
        data,
        null,
        2
      );

  }catch(e){

    $("liveOutput")
      .textContent =
      e.message;

  }

}


function renderPredictions(
  rows
){

  const body =
    $("predictionTable");

  body.innerHTML = "";

  rows.forEach(
    item => {

      const tr =
        document.createElement(
          "tr"
        );

      const actual =
        item.actual_result ||
        "—";

      tr.innerHTML = `
        <td>
          ${escapeHtml(
            item.target_issue
          )}
        </td>

        <td>
          ${escapeHtml(
            item.prediction
          )}
        </td>

        <td>
          ${item.confidence || 0}%
        </td>

        <td>
          ${escapeHtml(
            actual
          )}
        </td>

        <td>
          ${
            item.created_at
              ? new Date(
                  Number(
                    item.created_at
                  )
                ).toLocaleTimeString()
              : "—"
          }
        </td>
      `;

      body.appendChild(
        tr
      );

    }
  );

}


if(ADMIN){

  showPanel();

  refreshAll();

}else{

  showLogin();

}


setInterval(
  () => {

    if(ADMIN){
      refreshAll();
    }

  },
  5000
);

</script>

</body>

</html>
