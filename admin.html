<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>DY AI Admin</title>

<style>

body{
  margin:0;
  min-height:100vh;
  background:#05070d;
  color:#fff;
  font-family:Arial,sans-serif;
}

.box{
  width:calc(100% - 30px);
  max-width:500px;
  margin:50px auto;
  background:#0d111c;
  border:1px solid #20283b;
  border-radius:20px;
  padding:22px;
}

h2{
  text-align:center;
}

input,
button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:11px;
  border:1px solid #30394d;
  background:#080b13;
  color:white;
  box-sizing:border-box;
}

button{
  background:white;
  color:#05070d;
  font-weight:900;
  cursor:pointer;
}

.stat{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid #202534;
  font-size:13px;
}

.value{
  font-weight:900;
  text-align:right;
  word-break:break-all;
}

.good{
  color:#58ff91;
}

.bad{
  color:#ff5c5c;
}

#panel{
  display:none;
}

</style>

</head>

<body>

<div class="box">

<h2>
DY AI ADMIN
</h2>


<div id="login">

<input
  id="key"
  type="password"
  placeholder="Admin Key"
>


<button
  onclick="login()"
>
LOGIN
</button>


<div
  id="message"
>
</div>

</div>


<div id="panel">

<div class="stat">
<span>API Status</span>
<span
id="apiStatus"
class="value"
>--</span>
</div>

<div class="stat">
<span>Token</span>
<span
id="token"
class="value"
>--</span>
</div>

<div class="stat">
<span>Current Period</span>
<span
id="current"
class="value"
>--</span>
</div>

<div class="stat">
<span>Prediction Period</span>
<span
id="next"
class="value"
>--</span>
</div>

<div class="stat">
<span>Analysis</span>
<span
id="analysis"
class="value"
>--</span>
</div>

<div class="stat">
<span>Prediction</span>
<span
id="prediction"
class="value"
>--</span>
</div>


<button
onclick="loadStatus()"
>
REFRESH
</button>


<button
onclick="logout()"
>
LOGOUT
</button>

</div>

</div>


<script>

async function login(){

  const key =
    document.getElementById(
      "key"
    ).value.trim();


  const message =
    document.getElementById(
      "message"
    );


  if(!key){

    message.textContent =
      "Enter admin key";

    return;
  }


  try{

    const response =
      await fetch(
        "/api/admin/check?key=" +
        encodeURIComponent(key) +
        "&_=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(data.success){

      sessionStorage.setItem(
        "dy_admin",
        "1"
      );

      document.getElementById(
        "login"
      ).style.display =
        "none";

      document.getElementById(
        "panel"
      ).style.display =
        "block";

      loadStatus();

    }else{

      message.textContent =
        "INVALID ADMIN KEY";

    }

  }catch{

    message.textContent =
      "SERVER ERROR";

  }

}


async function loadStatus(){

  try{

    const h =
      await fetch(
        "/api/health?_=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    const health =
      await h.json();


    const api =
      document.getElementById(
        "apiStatus"
      );


    api.textContent =
      health.sourceStatus ||
      "--";


    api.className =
      "value " +
      (
        health.sourceStatus ===
        "LIVE"
          ? "good"
          : "bad"
      );


    const token =
      document.getElementById(
        "token"
      );


    token.textContent =
      health.tokenConfigured
        ? "CONFIGURED"
        : "MISSING";


    token.className =
      "value " +
      (
        health.tokenConfigured
          ? "good"
          : "bad"
      );


    const r =
      await fetch(
        "/api/state?_=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    const data =
      await r.json();


    document.getElementById(
      "current"
    ).textContent =
      data.currentPeriod || "--";


    document.getElementById(
      "next"
    ).textContent =
      data.predictionPeriod || "--";


    const a =
      data.analysis || {};


    document.getElementById(
      "analysis"
    ).textContent =
      a.active
        ? "RUNNING " +
          a.remaining +
          "s"
        : "READY";


    document.getElementById(
      "prediction"
    ).textContent =
      a.prediction ||
      "WAITING";

  }catch{

    document.getElementById(
      "apiStatus"
    ).textContent =
      "ERROR";

  }

}


function logout(){

  sessionStorage.removeItem(
    "dy_admin"
  );

  location.reload();

}


if(
  sessionStorage.getItem(
    "dy_admin"
  ) === "1"
){

  document.getElementById(
    "login"
  ).style.display =
    "none";

  document.getElementById(
    "panel"
  ).style.display =
    "block";

  loadStatus();

}


setInterval(
  () => {

    if(
      sessionStorage.getItem(
        "dy_admin"
      ) === "1"
    ){

      loadStatus();

    }

  },
  1000
);

</script>

</body>

</html>
