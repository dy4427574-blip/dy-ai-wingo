<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>DY AI Prediction</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#05070d;
  color:#fff;
  font-family:Arial,sans-serif;
}

.container{
  max-width:500px;
  margin:auto;
  padding:18px;
}

.header{
  text-align:center;
  margin-bottom:18px;
}

.header h1{
  margin:0;
  font-size:25px;
}

.status{
  margin-top:8px;
  font-size:12px;
  opacity:.7;
}

.card{
  background:#0d111c;
  border:1px solid #20283b;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
}

.label{
  font-size:12px;
  opacity:.6;
  margin-bottom:8px;
}

.period{
  font-size:20px;
  font-weight:bold;
  word-break:break-all;
}

.analysis{
  text-align:center;
  min-height:125px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.analysisText{
  font-size:14px;
  letter-spacing:1px;
  opacity:.8;
}

.count{
  font-size:55px;
  font-weight:bold;
  margin-top:8px;
}

.prediction{
  text-align:center;
  font-size:38px;
  font-weight:900;
  padding:25px 10px;
}

.wait{
  opacity:.5;
  font-size:20px;
}

.history{
  max-height:380px;
  overflow-y:auto;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:12px 4px;
  border-bottom:1px solid #1b2130;
  font-size:13px;
}

.big{
  font-weight:bold;
}

.small{
  font-weight:bold;
}

.error{
  color:#ff6868;
}

.live{
  color:#70ff9a;
}

.delayed{
  color:#ffb454;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>DY AI PREDICTION</h1>
    <div id="status" class="status">
      Connecting...
    </div>
  </div>

  <div class="card">
    <div class="label">CURRENT PERIOD</div>
    <div id="currentPeriod" class="period">--</div>
  </div>

  <div class="card">
    <div class="label">PREDICTION PERIOD</div>
    <div id="nextPeriod" class="period">--</div>
  </div>

  <div class="card analysis">

    <div id="analysisText"
         class="analysisText">
      WAITING FOR NEW PERIOD
    </div>

    <div id="count"
         class="count">
      --
    </div>

  </div>

  <div class="card">

    <div class="label">
      PREDICTION
    </div>

    <div id="prediction"
         class="prediction wait">
      WAITING
    </div>

  </div>

  <div class="card">

    <div class="label">
      HISTORY
    </div>

    <div id="history"
         class="history">
      Loading...
    </div>

  </div>

</div>

<script>

let lastTargetPeriod = null;

async function loadState(){

  try{

    const response = await fetch(
      "/api/state?_=" + Date.now(),
      {
        cache:"no-store"
      }
    );

    const data = await response.json();

    if(!data.success){
      throw new Error("API error");
    }

    /* PERIOD */

    document.getElementById(
      "currentPeriod"
    ).textContent =
      data.currentPeriod || "--";

    document.getElementById(
      "nextPeriod"
    ).textContent =
      data.nextPeriod || "--";

    /* STATUS */

    const status =
      document.getElementById("status");

    if(data.sourceStatus === "LIVE"){

      status.textContent =
        "● LIVE API";

      status.className =
        "status live";

    }else{

      status.textContent =
        "● DATA DELAYED";

      status.className =
        "status delayed";

    }

    if(data.error){

      status.textContent =
        "● API ERROR: " + data.error;

      status.className =
        "status error";
    }

    /* ANALYSIS */

    const analysis =
      data.analysis || {};

    document.getElementById(
      "analysisText"
    ).textContent =
      analysis.message ||
      "WAITING FOR NEW PERIOD";

    document.getElementById(
      "count"
    ).textContent =
      analysis.active
        ? analysis.remaining
        : "";

    /* PREDICTION */

    const prediction =
      document.getElementById(
        "prediction"
      );

    if(analysis.active){

      prediction.textContent =
        "ANALYZING...";

      prediction.className =
        "prediction wait";

    }else{

      const p =
        analysis.prediction ||
        "WAITING";

      prediction.textContent = p;

      prediction.className =
        p === "BIG" || p === "SMALL"
          ? "prediction"
          : "prediction wait";
    }

    /* HISTORY */

    renderHistory(
      data.history || []
    );

  }catch(error){

    document.getElementById(
      "status"
    ).textContent =
      "● CONNECTION ERROR";

    document.getElementById(
      "status"
    ).className =
      "status error";
  }
}

function renderHistory(rows){

  const box =
    document.getElementById(
      "history"
    );

  if(!rows.length){

    box.innerHTML =
      "No history available";

    return;
  }

  box.innerHTML =
    rows.map(row => {

      const size =
        row.size || "--";

      return `
        <div class="row">

          <span>
            ${escapeHtml(
              row.issueNumber
            )}
          </span>

          <span>
            ${row.number}
          </span>

          <span class="${
            size === "BIG"
              ? "big"
              : "small"
          }">
            ${size}
          </span>

        </div>
      `;

    }).join("");
}

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/*
  UI refresh every second.
  Server itself also polls the source every second.
*/

loadState();

setInterval(
  loadState,
  1000
);

</script>

</body>
</html>
