<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DY AI Wingo 30S</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#070b16;
  color:#fff;
  font-family:Arial,sans-serif;
}

.wrap{
  width:100%;
  max-width:500px;
  margin:auto;
  padding:12px;
}

.card{
  background:#0e1528;
  border:1px solid #27345b;
  border-radius:18px;
  padding:15px;
  margin-top:12px;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.header{
  text-align:center;
  padding:17px;
  background:linear-gradient(135deg,#111b35,#0b1022);
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:1px;
}

.sub{
  margin-top:5px;
  color:#8996b8;
  font-size:12px;
}

.game{
  position:relative;
  width:100%;
  height:330px;
  overflow:hidden;
  border-radius:18px;
  background:#111827;
  border:1px solid #27345b;
}

.game iframe{
  width:100%;
  height:100%;
  border:0;
}

.openGame{
  position:absolute;
  z-index:5;
  right:10px;
  top:10px;
  padding:9px 12px;
  border-radius:10px;
  background:#172443;
  color:#fff;
  border:1px solid #405486;
  text-decoration:none;
  font-size:11px;
  font-weight:800;
}

.label{
  color:#7f8cad;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.issue{
  margin-top:5px;
  font-size:18px;
  font-weight:900;
  word-break:break-all;
}

.timer{
  text-align:center;
  font-size:34px;
  font-weight:900;
  margin-top:10px;
}

.analysis{
  text-align:center;
  padding:20px 5px;
}

.spinner{
  width:36px;
  height:36px;
  margin:auto;
  border:4px solid #27345b;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.analysisText{
  margin-top:12px;
  color:#9da9c4;
  font-size:12px;
}

.predictionBox{
  display:none;
  text-align:center;
  padding:8px 0 3px;
}

.prediction{
  margin-top:7px;
  font-size:45px;
  line-height:1;
  font-weight:1000;
  letter-spacing:2px;
}

.big{
  color:#ffb35c;
}

.small{
  color:#6fa8ff;
}

.confidence{
  margin-top:10px;
  color:#9ca9c5;
  font-size:13px;
}

.confidence b{
  color:#fff;
}

.reason{
  margin-top:10px;
  background:#080d1b;
  border:1px solid #1d2947;
  border-radius:10px;
  padding:9px;
  color:#8592b1;
  font-size:11px;
}

.regime{
  margin-top:8px;
  color:#647291;
  font-size:10px;
}

.status{
  text-align:center;
  margin-top:10px;
  color:#63708e;
  font-size:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:10px;
}

th{
  color:#6e7b9b;
  padding:9px 3px;
  border-bottom:1px solid #26345a;
}

td{
  padding:9px 3px;
  text-align:center;
  border-bottom:1px solid #18233e;
}

.win{
  color:#55e39b;
  font-weight:900;
}

.loss{
  color:#ff657c;
  font-weight:900;
}

.pending{
  color:#7f8cad;
  font-weight:900;
}

.stats{
  display:flex;
  justify-content:space-between;
  margin-top:7px;
  color:#8490ad;
  font-size:11px;
}

.music{
  position:fixed;
  right:15px;
  bottom:15px;
  width:46px;
  height:46px;
  border-radius:50%;
  border:1px solid #405486;
  background:#111b35;
  color:#fff;
  font-size:18px;
  z-index:20;
}

.footer{
  text-align:center;
  padding:16px 0;
  color:#4f5c78;
  font-size:9px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card header">
    <div class="logo">DY AI WINGO 30S</div>
    <div class="sub">
      Live AI Analysis • 30 Second Game
    </div>
  </div>


  <div class="card" style="padding:0;overflow:hidden">

    <div class="game">

      <a
        class="openGame"
        href="https://www.shreewin38.com/#/register?invitationCode=88523152383"
        target="_blank"
        rel="noopener"
      >
        OPEN GAME
      </a>

      <iframe
        src="https://www.shreewin38.com/#/register?invitationCode=88523152383"
        allow="fullscreen"
        loading="eager"
      ></iframe>

    </div>

  </div>


  <div class="card">

    <div class="label">
      Target Period
    </div>

    <div
      class="issue"
      id="targetIssue"
    >
      Loading...
    </div>

    <div
      class="timer"
      id="timer"
    >
      30
    </div>


    <div
      class="analysis"
      id="analysisBox"
    >

      <div class="spinner"></div>

      <div
        class="analysisText"
        id="analysisText"
      >
        Waiting for live data...
      </div>

    </div>


    <div
      class="predictionBox"
      id="predictionBox"
    >

      <div class="label">
        AI PREDICTION
      </div>

      <div
        class="prediction"
        id="prediction"
      >
        —
      </div>

      <div class="confidence">
        Confidence:
        <b id="confidence">0%</b>
      </div>

      <div
        class="reason"
        id="reason"
      >
        —
      </div>

      <div
        class="regime"
        id="regime"
      >
        —
      </div>

      <div
        class="status"
        id="status"
      >
        Waiting for synchronization
      </div>

    </div>

  </div>


  <div class="card">

    <div
      style="
        display:flex;
        justify-content:space-between;
        align-items:center;
      "
    >

      <div>
        <div class="label">
          Prediction History
        </div>

        <div
          style="
            font-size:19px;
            font-weight:900;
            margin-top:4px;
          "
        >
          LAST 30
        </div>
      </div>

      <div
        id="stats"
        style="
          font-size:11px;
          color:#8390ad;
        "
      >
        0W • 0L
      </div>

    </div>


    <table>

      <thead>

        <tr>
          <th>PERIOD</th>
          <th>PRED</th>
          <th>RESULT</th>
          <th>W/L</th>
        </tr>

      </thead>

      <tbody id="historyBody">

        <tr>
          <td colspan="4">
            Loading...
          </td>
        </tr>

      </tbody>

    </table>

  </div>


  <div class="footer">
    DY AI • Live Data
  </div>

</div>


<button
  class="music"
  id="musicBtn"
>
  ♫
</button>


<audio
  id="music"
  loop
  preload="none"
>
  <source
    src="/music.mp3"
    type="audio/mpeg"
  >
</audio>


<script>

const music =
  document.getElementById("music");

const musicBtn =
  document.getElementById("musicBtn");

let musicPlaying = false;

let lastTarget = "";

let analysisRunning = false;

let providerUpdated = 0;

let localTimer = 30;


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================
   RESULT CLASS
========================================= */

function resultClass(value){

  const x =
    String(value || "")
      .toUpperCase();

  if(x === "BIG"){
    return "big";
  }

  if(x === "SMALL"){
    return "small";
  }

  if(x === "WIN"){
    return "win";
  }

  if(x === "LOSS"){
    return "loss";
  }

  return "pending";
}


/* =========================================
   TIMER
========================================= */

function updateTimer(){

  if(providerUpdated){

    const elapsed =
      Math.floor(
        (Date.now() - providerUpdated) / 1000
      );

    let remaining =
      30 - (elapsed % 30);

    if(
      remaining < 1 ||
      remaining > 30
    ){
      remaining = 30;
    }

    localTimer = remaining;

  }else{

    localTimer--;

    if(localTimer <= 0){
      localTimer = 30;
    }

  }

  document.getElementById("timer")
    .textContent =
      String(localTimer)
        .padStart(2,"0");

}

setInterval(
  updateTimer,
  1000
);


/* =========================================
   ANALYSIS ANIMATION
========================================= */

function startAnalysis(){

  if(analysisRunning){
    return;
  }

  analysisRunning = true;

  const box =
    document.getElementById(
      "analysisBox"
    );

  const predictionBox =
    document.getElementById(
      "predictionBox"
    );

  const text =
    document.getElementById(
      "analysisText"
    );

  box.style.display =
    "block";

  predictionBox.style.display =
    "none";

  let seconds = 3;

  text.textContent =
    "Analyzing recent data... 3";

  const timer =
    setInterval(() => {

      seconds--;

      if(seconds === 2){

        text.textContent =
          "Checking trend & transitions... 2";

      }

      if(seconds === 1){

        text.textContent =
          "Finalizing AI analysis... 1";

      }

      if(seconds <= 0){

        clearInterval(timer);

        box.style.display =
          "none";

        predictionBox.style.display =
          "block";

        analysisRunning =
          false;
      }

    },1000);

}


/* =========================================
   RENDER PREDICTION
========================================= */

function renderPrediction(data){

  const value =
    String(
      data.prediction || "—"
    ).toUpperCase();

  const element =
    document.getElementById(
      "prediction"
    );

  element.textContent =
    value;

  element.className =
    "prediction " +
    resultClass(value);


  const confidence =
    Number(
      data.confidence || 0
    );

  document.getElementById(
    "confidence"
  ).textContent =
    Math.max(
      0,
      Math.min(100,confidence)
    ) + "%";


  document.getElementById(
    "reason"
  ).textContent =
    data.reason ||
    "Multi-signal analysis";


  document.getElementById(
    "regime"
  ).textContent =
    data.regime
      ? "REGIME: " + data.regime
      : "";


  document.getElementById(
    "status"
  ).textContent =
    data.error
      ? "Data connection issue"
      : "AI synchronized";

}


/* =========================================
   HISTORY
========================================= */

function renderHistory(rows){

  const body =
    document.getElementById(
      "historyBody"
    );

  if(
    !Array.isArray(rows) ||
    rows.length === 0
  ){

    body.innerHTML = `
      <tr>
        <td colspan="4">
          No history available
        </td>
      </tr>
    `;

    document.getElementById(
      "stats"
    ).textContent =
      "0W • 0L";

    return;
  }


  let wins = 0;
  let losses = 0;


  body.innerHTML =
    rows
      .slice(0,30)
      .map(row => {

        const period =
          row.target_issue ??
          row.issue ??
          row.issueNumber ??
          "—";


        const prediction =
          String(
            row.prediction ??
            row.pred ??
            ""
          ).toUpperCase();


        const actual =
          String(
            row.actual_result ??
            row.result ??
            ""
          ).toUpperCase();


        let status =
          String(
            row.status ??
            ""
          ).toUpperCase();


        /*
          Missing actual result means
          PENDING — never WIN/LOSS.
        */

        if(
          !actual ||
          actual === "NULL" ||
          actual === "UNDEFINED" ||
          actual === "—"
        ){

          status =
            "PENDING";

        }else{

          if(
            status !== "WIN" &&
            status !== "LOSS"
          ){

            status =
              prediction === actual
                ? "WIN"
                : "LOSS";

          }

        }


        if(status === "WIN"){
          wins++;
        }

        if(status === "LOSS"){
          losses++;
        }


        return `
          <tr>

            <td>
              ${escapeHtml(period)}
            </td>

            <td
              class="${resultClass(prediction)}"
            >
              ${escapeHtml(
                prediction || "—"
              )}
            </td>

            <td
              class="${resultClass(actual)}"
            >
              ${escapeHtml(
                actual || "—"
              )}
            </td>

            <td
              class="${resultClass(status)}"
            >
              ${escapeHtml(
                status || "PENDING"
              )}
            </td>

          </tr>
        `;

      })
      .join("");


  document.getElementById(
    "stats"
  ).textContent =
    `${wins}W • ${losses}L`;

}


/* =========================================
   LOAD STATE
========================================= */

async function loadState(){

  try{

    const response =
      await fetch(
        "/api/state?ts=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );
    }


    const data =
      await response.json();


    if(!data.ok){
      return;
    }


    const target =
      data.targetIssue ||
      data.currentIssue ||
      "";


    document.getElementById(
      "targetIssue"
    ).textContent =
      target || "Waiting...";


    if(data.providerLastUpdated){

      providerUpdated =
        Number(
          data.providerLastUpdated
        );

    }


    /*
      New target = new 3-second
      analysis animation.
    */

    if(
      target &&
      target !== lastTarget
    ){

      lastTarget =
        target;

      startAnalysis();


      setTimeout(() => {

        renderPrediction(data);

      },3000);

    }else{

      /*
        Same target:
        update current information
        without restarting animation.
      */

      if(
        !analysisRunning &&
        data.prediction
      ){

        renderPrediction(data);

      }

    }


    renderHistory(
      data.history || []
    );


  }catch(error){

    console.log(
      "STATE ERROR:",
      error
    );

    document.getElementById(
      "status"
    ).textContent =
      "Connecting to server...";

  }

}


/* =========================================
   MUSIC
========================================= */

musicBtn.addEventListener(
  "click",
  async () => {

    try{

      if(!musicPlaying){

        await music.play();

        musicPlaying =
          true;

        musicBtn.textContent =
          "🔊";

      }else{

        music.pause();

        musicPlaying =
          false;

        musicBtn.textContent =
          "♫";

      }

    }catch(error){

      console.log(
        "Music error:",
        error
      );

    }

  }
);


/* =========================================
   START
========================================= */

loadState();

setInterval(
  loadState,
  1000
);

</script>

</body>
</html>
