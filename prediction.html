<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DY AI Wingo 30S</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#070b16;
  color:#fff;
}
.wrap{
  width:100%;
  max-width:480px;
  margin:auto;
  padding:12px;
}
.header{
  background:linear-gradient(135deg,#111b35,#0b1022);
  border:1px solid #27345b;
  border-radius:18px;
  padding:16px;
  text-align:center;
  box-shadow:0 8px 30px #0008;
}
.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:1px;
}
.sub{
  margin-top:5px;
  color:#9ca9ca;
  font-size:12px;
}
.game{
  margin-top:12px;
  height:310px;
  border-radius:18px;
  overflow:hidden;
  background:#111827;
  border:1px solid #27345b;
  position:relative;
}
.game iframe{
  width:100%;
  height:100%;
  border:0;
}
.open{
  position:absolute;
  right:10px;
  top:10px;
  z-index:3;
  background:#182442;
  color:#fff;
  border:1px solid #405486;
  padding:8px 11px;
  border-radius:10px;
  text-decoration:none;
  font-size:12px;
}
.card{
  margin-top:12px;
  background:#0e1528;
  border:1px solid #26345b;
  border-radius:18px;
  padding:15px;
}
.label{
  color:#8996b8;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
}
.issue{
  margin-top:6px;
  font-size:18px;
  font-weight:800;
  word-break:break-all;
}
.timer{
  margin-top:10px;
  text-align:center;
  font-size:32px;
  font-weight:900;
}
.analysis{
  text-align:center;
  padding:22px 10px;
}
.spinner{
  width:35px;
  height:35px;
  margin:auto;
  border:4px solid #26345b;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.analysis-text{
  margin-top:12px;
  color:#aeb9d4;
  font-size:13px;
}
.pred{
  display:none;
  text-align:center;
}
.pred-value{
  margin-top:8px;
  font-size:42px;
  font-weight:1000;
  letter-spacing:2px;
}
.conf{
  margin-top:6px;
  font-size:13px;
  color:#aeb9d4;
}
.reason{
  margin-top:10px;
  padding:9px;
  border-radius:10px;
  background:#080d1b;
  color:#8996b8;
  font-size:11px;
}
.status{
  margin-top:10px;
  text-align:center;
  font-size:11px;
  color:#7482a5;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:11px;
}
th{
  color:#7180a4;
  font-weight:700;
  padding:9px 4px;
  border-bottom:1px solid #26345b;
}
td{
  padding:9px 4px;
  text-align:center;
  border-bottom:1px solid #18233f;
}
.win{color:#55e39b;font-weight:800}
.loss{color:#ff657c;font-weight:800}
.pending{color:#8996b8;font-weight:700}
.big{color:#ffb45d;font-weight:900}
.small{color:#71a7ff;font-weight:900}
.footer{
  text-align:center;
  color:#56627f;
  font-size:10px;
  padding:16px 0;
}
.music{
  position:fixed;
  bottom:15px;
  right:15px;
  width:45px;
  height:45px;
  border-radius:50%;
  border:1px solid #405486;
  background:#111b35;
  color:white;
  font-size:18px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">
    <div class="logo">DY AI WINGO 30S</div>
    <div class="sub">Live AI Analysis • Smooth Updates</div>
  </div>

  <div class="game">
    <a
      class="open"
      href="https://www.shreewin38.com/#/register?invitationCode=88523152383"
      target="_blank"
    >OPEN GAME</a>

    <iframe
      src="https://www.shreewin38.com/#/register?invitationCode=88523152383"
      allow="fullscreen"
    ></iframe>
  </div>

  <div class="card">

    <div class="label">Target Period</div>
    <div class="issue" id="targetIssue">Loading...</div>

    <div class="timer" id="timer">30</div>

    <div class="analysis" id="analysisBox">
      <div class="spinner"></div>
      <div class="analysis-text" id="analysisText">
        Waiting for live data...
      </div>
    </div>

    <div class="pred" id="predictionBox">

      <div class="label">AI RESULT</div>

      <div class="pred-value" id="prediction">
        —
      </div>

      <div class="conf">
        Confidence: <b id="confidence">0%</b>
      </div>

      <div class="reason" id="reason">
        —
      </div>

      <div class="status" id="modelStatus">
        AI synchronized
      </div>

    </div>

  </div>

  <div class="card">

    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div class="label">Prediction History</div>
        <div style="font-size:18px;font-weight:900;margin-top:4px">
          LAST 30
        </div>
      </div>

      <div id="recordStats" style="font-size:11px;color:#8290b2">
        —
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>PERIOD</th>
          <th>PRED</th>
          <th>RESULT</th>
          <th>W/L</th>
        </tr>
      </thead>

      <tbody id="historyBody">
        <tr>
          <td colspan="4">Loading...</td>
        </tr>
      </tbody>
    </table>

  </div>

  <div class="footer">
    DY AI • Live Wingo 30S
  </div>

</div>

<button class="music" id="musicBtn">♫</button>

<audio id="music" loop>
  <source src="/music.mp3" type="audio/mpeg">
</audio>

<script>

const GAME_URL =
  "https://www.shreewin38.com/#/register?invitationCode=88523152383";

let lastTarget = "";
let lastPrediction = "";
let analysisTimer = null;
let providerUpdated = 0;
let timerValue = 30;


/* -----------------------------
   BASIC HELPERS
----------------------------- */

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function getClass(value){

  if(!value) return "";

  const x = String(value).toUpperCase();

  if(x === "BIG") return "big";
  if(x === "SMALL") return "small";
  if(x === "WIN") return "win";
  if(x === "LOSS") return "loss";
  if(x === "PENDING") return "pending";

  return "";
}


/* -----------------------------
   TIMER
----------------------------- */

function updateTimer(){

  const now = Date.now();

  if(providerUpdated){

    const diff =
      Math.floor((now - providerUpdated) / 1000);

    let sec = 30 - (diff % 30);

    if(sec <= 0 || sec > 30){
      sec = 30;
    }

    timerValue = sec;

  }else{

    timerValue--;

    if(timerValue <= 0){
      timerValue = 30;
    }

  }

  document.getElementById("timer").textContent =
    String(timerValue).padStart(2,"0");
}

setInterval(updateTimer,1000);


/* -----------------------------
   3 SECOND ANALYSIS
----------------------------- */

function startAnalysis(){

  clearTimeout(analysisTimer);

  const box =
    document.getElementById("analysisBox");

  const pred =
    document.getElementById("predictionBox");

  const text =
    document.getElementById("analysisText");

  box.style.display = "block";
  pred.style.display = "none";

  let count = 3;

  text.textContent =
    "Analyzing recent trend... 3";

  const interval = setInterval(()=>{

    count--;

    if(count === 2){

      text.textContent =
        "Checking sequence & transitions... 2";

    }else if(count === 1){

      text.textContent =
        "Finalizing AI signal... 1";

    }

    if(count <= 0){

      clearInterval(interval);

      box.style.display = "none";
      pred.style.display = "block";

    }

  },1000);
}


/* -----------------------------
   STATE
----------------------------- */

async function loadState(){

  try{

    const r =
      await fetch("/api/state?ts="+Date.now(),{
        cache:"no-store"
      });

    const data = await r.json();

    if(!data.ok){
      return;
    }

    const target =
      data.targetIssue ||
      data.currentIssue ||
      "—";

    document.getElementById("targetIssue")
      .textContent = target;

    if(data.providerLastUpdated){

      providerUpdated =
        Number(data.providerLastUpdated);

    }

    /*
      New target = new analysis cycle.
    */

    if(target !== lastTarget){

      lastTarget = target;

      startAnalysis();

      setTimeout(()=>{

        renderPrediction(data);

      },3000);

    }else{

      /*
        Same target:
        keep updating confidence/reason,
        but don't restart analysis.
      */

      if(
        document.getElementById("predictionBox")
          .style.display === "block"
      ){

        renderPrediction(data);

      }

    }

    renderHistory(data.history || []);

  }catch(e){

    console.log("STATE ERROR:",e);

  }

}


/* -----------------------------
   PREDICTION
----------------------------- */

function renderPrediction(data){

  const prediction =
    String(data.prediction || "—")
      .toUpperCase();

  document.getElementById("prediction")
    .textContent = prediction;

  document.getElementById("prediction")
    .className =
      "pred-value " + getClass(prediction);

  document.getElementById("confidence")
    .textContent =
      Math.max(
        0,
        Math.min(
          100,
          Number(data.confidence || 0)
        )
      ) + "%";

  document.getElementById("reason")
    .textContent =
      data.reason ||
      "AI analysis synchronized.";

  document.getElementById("modelStatus")
    .textContent =
      data.regime
        ? "Regime: " + data.regime
        : "AI synchronized";

  lastPrediction = prediction;

}


/* -----------------------------
   HISTORY
----------------------------- */

function renderHistory(rows){

  const body =
    document.getElementById("historyBody");

  if(!Array.isArray(rows) || rows.length === 0){

    body.innerHTML =
      `<tr>
        <td colspan="4">No history yet</td>
      </tr>`;

    document.getElementById("recordStats")
      .textContent = "0 records";

    return;
  }

  const list =
    rows.slice(0,30);

  let wins = 0;
  let losses = 0;

  body.innerHTML =
    list.map(row=>{

      const period =
        row.target_issue ??
        row.issueNumber ??
        row.period ??
        "—";

      const pred =
        String(
          row.prediction ??
          row.pred ??
          "—"
        ).toUpperCase();

      const actual =
        String(
          row.actual_result ??
          row.result ??
          ""
        ).toUpperCase();

      let status =
        String(
          row.status ??
          ""
        ).toUpperCase();

      /*
        IMPORTANT:
        If actual result is missing,
        it MUST remain PENDING.
      */

      if(!actual ||
         actual === "—" ||
         actual === "NULL" ||
         actual === "PENDING"){

        status = "PENDING";

      }else{

        if(
          status !== "WIN" &&
          status !== "LOSS"
        ){

          if(pred === actual){
            status = "WIN";
          }else{
            status = "LOSS";
          }

        }

      }

      if(status === "WIN") wins++;
      if(status === "LOSS") losses++;

      return `
        <tr>

          <td>${esc(period)}</td>

          <td class="${getClass(pred)}">
            ${esc(pred || "—")}
          </td>

          <td class="${getClass(actual)}">
            ${esc(actual || "—")}
          </td>

          <td class="${getClass(status)}">
            ${esc(status || "PENDING")}
          </td>

        </tr>
      `;

    }).join("");

  document.getElementById("recordStats")
    .textContent =
      `${wins}W • ${losses}L`;

}


/* -----------------------------
   MUSIC
----------------------------- */

const music =
  document.getElementById("music");

const musicBtn =
  document.getElementById("musicBtn");

let playing = false;

musicBtn.onclick = async ()=>{

  try{

    if(!playing){

      await music.play();

      playing = true;
      musicBtn.textContent = "🔊";

    }else{

      music.pause();

      playing = false;
      musicBtn.textContent = "♫";

    }

  }catch(e){

    console.log(e);

  }

};


/* -----------------------------
   START
----------------------------- */

loadState();

setInterval(loadState,1000);

</script>

</body>
</html>
