<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,
maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control"
content="no-store">

<title>DY AI WinGo</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:14px;
 background:#05070c;
 color:#fff;
 font-family:Arial,sans-serif
}

.app{
 max-width:560px;
 margin:auto
}

.card{
 background:linear-gradient(
  145deg,#101722,#080c13
 );
 border:1px solid #202c3f;
 border-radius:18px;
 padding:16px;
 margin-bottom:12px;
 box-shadow:0 12px 35px #0008
}

.logo{
 text-align:center;
 font-size:25px;
 font-weight:900
}

.blue{color:#2196ff}

.sub{
 text-align:center;
 color:#8490a3;
 font-size:11px;
 margin-top:5px
}

.status{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:8px;
 margin:13px 0 2px;
 color:#8995a8;
 font-size:12px
}

.dot{
 width:9px;
 height:9px;
 border-radius:50%;
 background:#555
}

.online .dot{
 background:#19ed8b;
 box-shadow:0 0 13px #19ed8b
}

.offline .dot{
 background:#ff4655;
 box-shadow:0 0 13px #ff4655
}

.label{
 color:#7d899c;
 font-size:10px;
 letter-spacing:1.4px;
 font-weight:bold
}

.value{
 margin-top:6px;
 font-size:18px;
 font-weight:900;
 word-break:break-all
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.bigbox{
 text-align:center;
 padding:22px 12px
}

.prediction{
 margin:11px 0;
 font-size:39px;
 font-weight:1000
}

.big{
 color:#ff9d35;
 text-shadow:0 0 20px #ff9d3544
}

.small{
 color:#42a9ff;
 text-shadow:0 0 20px #42a9ff44
}

.wait{color:#ffd34d}
.skip{color:#8e9aac}

.progress{
 height:8px;
 background:#1b2533;
 border-radius:20px;
 overflow:hidden;
 margin-top:12px
}

.bar{
 width:0%;
 height:100%;
 background:#2196ff;
 transition:.2s
}

.row{
 display:flex;
 justify-content:space-between;
 gap:10px;
 padding:9px 0;
 border-bottom:1px solid #17202d;
 font-size:12px
}

.row:last-child{
 border-bottom:0
}

.history{
 display:flex;
 gap:6px;
 flex-wrap:wrap;
 margin-top:10px
}

.ball{
 width:38px;
 height:38px;
 border-radius:10px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#121a26;
 border:1px solid #263247;
 font-weight:900
}

.ball.big{color:#ffac45}
.ball.small{color:#4aaaff}

input{
 width:100%;
 padding:13px;
 background:#080d15;
 border:1px solid #29364a;
 border-radius:12px;
 color:#fff;
 outline:none
}

button{
 width:100%;
 padding:13px;
 margin-top:9px;
 border:0;
 border-radius:12px;
 background:#188fff;
 color:#fff;
 font-weight:900
}

.error{
 color:#ff5b68;
 font-size:12px;
 margin-top:8px
}

.hidden{
 display:none!important
}

.footer{
 text-align:center;
 color:#596577;
 font-size:10px;
 padding:5px
}
</style>
</head>

<body>

<div class="app">

<div id="loginCard" class="card">

 <div class="logo">
  DY AI WIN<span class="blue">GO</span>
 </div>

 <div class="sub">
  LIVE RANDOM PREDICTION
 </div>

 <div style="margin-top:20px">

  <div class="label">
   ACCESS KEY
  </div>

  <input
   id="accessKey"
   placeholder="Enter access key"
  >

  <button onclick="login()">
   UNLOCK SYSTEM
  </button>

  <div id="loginMsg"
       class="error">
  </div>

 </div>
</div>

<div id="dashboard"
     class="hidden">

 <div class="card">

  <div class="logo">
   DY AI WIN<span class="blue">GO</span>
  </div>

  <div class="sub">
   RANDOM LIVE ENGINE
  </div>

  <div
   id="statusBox"
   class="status offline">

   <span class="dot"></span>

   <span id="status">
    CONNECTING...
   </span>

  </div>

 </div>

 <div class="card">

  <div class="label">
   CURRENT PERIOD
  </div>

  <div
   id="currentIssue"
   class="value">
   —
  </div>

  <div style="height:15px"></div>

  <div class="label">
   LATEST RESULT
  </div>

  <div
   id="latestResult"
   class="value">
   —
  </div>

 </div>

 <div class="card bigbox">

  <div class="label">
   AI ML PREDICTION
  </div>

  <div
   id="prediction"
   class="prediction wait">
   WAIT
  </div>

  <div
   id="targetText"
   class="label">
   TARGET: —
  </div>

  <div class="progress">
   <div
    id="progressBar"
    class="bar">
   </div>
  </div>

  <div
   id="progressText"
   style="
   font-size:10px;
   color:#68758a;
   margin-top:7px">
   IDLE
  </div>

 </div>

 <div class="grid">

  <div class="card">

   <div class="label">
    CONFIDENCE
   </div>

   <div
    id="confidence"
    class="value">
    —
   </div>

  </div>

  <div class="card">

   <div class="label">
    MODE
   </div>

   <div
    id="mode"
    class="value">
    WAIT
   </div>

  </div>

  <div class="card">

   <div class="label">
    MODEL
   </div>

   <div
    id="model"
    class="value"
    style="font-size:12px">
    —
   </div>

  </div>

  <div class="card">

   <div class="label">
    ENGINE
   </div>

   <div
    id="evidence"
    class="value"
    style="font-size:12px">
    —
   </div>

  </div>

 </div>

 <div class="card">

  <div class="label">
   RECENT RESULTS
  </div>

  <div
   id="history"
   class="history">
  </div>

 </div>

 <div class="card">

  <div class="row">
   <span>API UPDATE</span>
   <b id="apiTime">—</b>
  </div>

  <div class="row">
   <span>ENGINE</span>
   <b style="color:#20e88a">
    RANDOM
   </b>
  </div>

  <button
   onclick="logout()"
   style="background:#202936">
   LOGOUT
  </button>

 </div>

 <div class="footer">
  DY AI WinGo • Random engine
 </div>

</div>

</div>

<script>

let requestRunning=false;

function getDeviceId(){

 let id=
  localStorage.getItem(
   "dy_device_id"
  );

 if(!id){

  id=
   "dy-" +
   crypto.randomUUID();

  localStorage.setItem(
   "dy_device_id",
   id
  );
 }

 return id;
}

async function login(){

 const key=
  document
  .getElementById(
   "accessKey"
  )
  .value
  .trim();

 const msg=
  document
  .getElementById(
   "loginMsg"
  );

 if(!key){

  msg.textContent=
   "Enter access key";

  return;
 }

 msg.textContent=
  "Checking...";

 try{

  const response=
   await fetch(
    "/api/key/check?_="+
    Date.now(),
    {
     method:"POST",
     cache:"no-store",

     headers:{
      "Content-Type":
       "application/json"
     },

     body:JSON.stringify({
      accessKey:key,
      deviceId:
       getDeviceId()
     })
    }
   );

  const data=
   await response.json();

  if(!data.ok){

   msg.textContent=
    data.message ||
    "Access denied";

   return;
  }

  localStorage.setItem(
   "dy_access_key",
   key
  );

  openDashboard();

 }catch(error){

  msg.textContent=
   "Server connection failed";
 }
}

function openDashboard(){

 document
  .getElementById(
   "loginCard"
  )
  .classList
  .add("hidden");

 document
  .getElementById(
   "dashboard"
  )
  .classList
  .remove("hidden");

 updateState();
}

function logout(){

 localStorage.removeItem(
  "dy_access_key"
 );

 location.reload();
}

async function verifyKey(){

 const key=
  localStorage.getItem(
   "dy_access_key"
  );

 if(!key) return;

 try{

  const response=
   await fetch(
    "/api/key/check?_="+
    Date.now(),
    {
     method:"POST",
     cache:"no-store",

     headers:{
      "Content-Type":
       "application/json"
     },

     body:JSON.stringify({
      accessKey:key,
      deviceId:
       getDeviceId()
     })
    }
   );

  const data=
   await response.json();

  if(data.ok){

   openDashboard();

  }else{

   localStorage.removeItem(
    "dy_access_key"
   );
  }

 }catch(error){}
}

function setStatus(
 online
){

 const box=
  document.getElementById(
   "statusBox"
  );

 const text=
  document.getElementById(
   "status"
  );

 box.className=
  "status " +
  (
   online
    ? "online"
    : "offline"
  );

 text.textContent=
  online
   ? "LIVE API CONNECTED"
   : "OFFLINE";
}

function render(data){

 setStatus(
  Boolean(data.online)
 );

 document.getElementById(
  "currentIssue"
 ).textContent=
  data.currentIssue ||
  "—";

 if(
  data.latestNumber !==
  null &&
  data.latestNumber !==
  undefined
 ){

  document.getElementById(
   "latestResult"
  ).textContent=
   data.latestNumber +
   " " +
   (
    data.latestResult ||
    ""
   );

 }else{

  document.getElementById(
   "latestResult"
  ).textContent=
   "—";
 }

 document.getElementById(
  "model"
 ).textContent=
  data.model ||
  "—";

 const prediction=
  document.getElementById(
   "prediction"
  );

 const mode=
  document.getElementById(
   "mode"
  );

 const target=
  document.getElementById(
   "targetText"
  );

 const confidence=
  document.getElementById(
   "confidence"
  );

 const evidence=
  document.getElementById(
   "evidence"
  );

 const bar=
  document.getElementById(
   "progressBar"
  );

 const progressText=
  document.getElementById(
   "progressText"
  );

 prediction.className=
  "prediction wait";

 if(
  data.analysisSession &&
  data.analysisSession.active
 ){

  prediction.textContent=
   "ANALYZING";

  mode.textContent=
   "ANALYZING";

  target.textContent=
   "TARGET: " +
   (
    data.analysisSession
     .targetIssue ||
    "—"
   );

  const p=
   Number(
    data.analysisSession
     .progress || 0
   );

  bar.style.width=
   p + "%";

  progressText.textContent=
   p +
   "% ANALYSIS";

  confidence.textContent=
   "RANDOM";

  evidence.textContent=
   "RANDOM ENGINE";

 }
 else if(
  data.cycle &&
  data.cycle.mode ===
   "SKIP"
 ){

  prediction.textContent=
   "SKIP";

  prediction.className=
   "prediction skip";

  mode.textContent=
   "SKIP";

  target.textContent=
   "WAITING NEXT ROUND";

  bar.style.width=
   "0%";

  progressText.textContent=
   "RISK CONTROL";

  confidence.textContent=
   "—";

  evidence.textContent=
   "SKIP: " +
   (
    data.cycle
     .skipRemaining ||
    0
   );

 }
 else if(
  data.prediction
 ){

  const value=
   data.prediction
    .prediction;

  prediction.textContent=
   value;

  prediction.className=
   "prediction " +
   (
    value === "BIG"
     ? "big"
     : "small"
   );

  mode.textContent=
   "PREDICT";

  target.textContent=
   "TARGET: " +
   (
    data.prediction
     .targetIssue ||
    data.currentIssue ||
    "—"
   );

  confidence.textContent=
   (
    data.prediction
     .confidence ||
    0
   ) + "%";

  evidence.textContent=
   "RANDOM";

  bar.style.width=
   "100%";

  progressText.textContent=
   "PREDICTION READY";

 }
 else {

  prediction.textContent=
   "WAIT";

  mode.textContent=
   data.cycle
    ? data.cycle.mode
    : "WAIT";

  target.textContent=
   "TARGET: " +
   (
    data.currentIssue ||
    "—"
   );

  bar.style.width=
   "0%";

  progressText.textContent=
   data.online
    ? "WAITING FOR ANALYSIS"
    : "WAITING FOR API";

  confidence.textContent=
   "—";

  evidence.textContent=
   "—";
 }

 const history=
  document.getElementById(
   "history"
  );

 history.innerHTML="";

 const list=
  Array.isArray(data.history)
   ? data.history.slice(-10)
   : [];

 list.reverse()
  .forEach(row=>{

   const el=
    document.createElement(
     "div"
    );

   el.className=
    "ball " +
    (
     row.result ===
      "BIG"
      ? "big"
      : "small"
    );

   el.textContent=
    row.number;

   el.title=
    row.issue || "";

   history.appendChild(el);
  });

 if(data.fetchedAt){

  document.getElementById(
   "apiTime"
  ).textContent=
   new Date(
    data.fetchedAt
   ).toLocaleTimeString();
 }
}

async function updateState(){

 if(requestRunning)
  return;

 requestRunning=true;

 try{

  const response=
   await fetch(
    "/api/state?_="+
    Date.now(),
    {
     cache:"no-store",

     headers:{
      "Cache-Control":
       "no-cache",
      "Pragma":
       "no-cache"
     }
    }
   );

  const data=
   await response.json();

  render(data);

 }catch(error){

  setStatus(false);

 }finally{

  requestRunning=false;

  setTimeout(
   updateState,
   1000
  );
 }
}

verifyKey();

</script>

</body>
</html>
