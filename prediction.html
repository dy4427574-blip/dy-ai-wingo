<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DY AI WinGo 30S</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080b10;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

.app{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:12px;
}

.header{
  background:linear-gradient(135deg,#151b25,#0d1118);
  border:1px solid #242c38;
  border-radius:20px;
  padding:18px;
  margin-bottom:12px;
  box-shadow:0 10px 35px rgba(0,0,0,.35);
}

.logo{
  font-size:24px;
  font-weight:900;
  letter-spacing:1px;
}

.logo span{
  color:#ff9a42;
}

.sub{
  margin-top:5px;
  color:#737d8c;
  font-size:11px;
  letter-spacing:1.5px;
}

.login{
  background:#11161e;
  border:1px solid #252e3b;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}

input{
  width:100%;
  height:48px;
  background:#080c12;
  border:1px solid #303947;
  border-radius:12px;
  color:#fff;
  padding:0 14px;
  outline:none;
  font-size:14px;
}

button{
  width:100%;
  height:48px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#ff9a42,#ff6f2c);
  color:#fff;
  font-weight:800;
  font-size:15px;
}

.status{
  text-align:center;
  margin-top:9px;
  font-size:12px;
  color:#778292;
}

.card{
  background:linear-gradient(145deg,#0d1219,#090d13);
  border:1px solid #252d38;
  border-radius:22px;
  padding:22px 18px;
  margin-bottom:12px;
  box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.card-title{
  color:#778292;
  text-align:center;
  font-size:11px;
  letter-spacing:2px;
  font-weight:800;
}

.target{
  text-align:center;
  color:#929baa;
  font-size:13px;
  margin-top:12px;
  word-break:break-all;
}

.prediction{
  text-align:center;
  font-size:52px;
  font-weight:900;
  margin-top:22px;
  letter-spacing:2px;
}

.big{
  color:#ff963d;
  text-shadow:0 0 22px rgba(255,150,61,.35);
}

.small{
  color:#53adff;
  text-shadow:0 0 22px rgba(83,173,255,.35);
}

.confidence{
  text-align:center;
  margin-top:12px;
  color:#b8c0cc;
  font-size:13px;
}

.analysis{
  text-align:center;
  margin-top:13px;
  color:#747f8e;
  font-size:11px;
  letter-spacing:1px;
  font-weight:800;
}

.thinking{
  display:none;
  text-align:center;
  margin-top:20px;
}

.thinking-text{
  color:#ff963d;
  font-size:13px;
  font-weight:800;
  letter-spacing:2px;
}

.dots{
  margin-top:10px;
}

.dot{
  display:inline-block;
  width:6px;
  height:6px;
  background:#ff963d;
  border-radius:50%;
  margin:0 3px;
  animation:blink 1s infinite;
}

.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}

@keyframes blink{
  0%,100%{opacity:.2}
  50%{opacity:1}
}

.live-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.live-box{
  background:#080c11;
  border:1px solid #202833;
  border-radius:14px;
  padding:14px 10px;
  min-width:0;
}

.live-label{
  color:#687383;
  font-size:9px;
  letter-spacing:.7px;
  margin-bottom:9px;
}

.live-value{
  font-size:13px;
  font-weight:800;
  word-break:break-all;
}

.live-big{
  color:#ff963d;
}

.live-small{
  color:#53adff;
}

.history-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.history-title{
  font-size:14px;
  font-weight:900;
}

.last{
  color:#697483;
  font-size:10px;
  letter-spacing:1px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:450px;
}

th{
  text-align:left;
  color:#687383;
  font-size:9px;
  letter-spacing:.7px;
  padding:10px 7px;
  border-bottom:1px solid #252d37;
}

td{
  padding:12px 7px;
  font-size:11px;
  border-bottom:1px solid #171d25;
}

.issue{
  color:#b8c0ca;
  font-family:monospace;
}

.result-big{
  color:#ff963d;
  font-weight:800;
}

.result-small{
  color:#53adff;
  font-weight:800;
}

.win{
  color:#31dc88;
  font-weight:900;
}

.loss{
  color:#ff5d69;
  font-weight:900;
}

.pending{
  color:#8d98a8;
}

.empty{
  text-align:center;
  color:#687383;
  padding:25px;
  font-size:12px;
}

.error{
  color:#ff6873;
}

@media(max-width:360px){
  .prediction{
    font-size:44px;
  }

  .live-grid{
    gap:6px;
  }

  .live-box{
    padding:12px 7px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">DY <span>AI</span> WinGo</div>
    <div class="sub">30 SECOND ANALYSIS ENGINE</div>
  </div>

  <div class="login" id="loginBox">
    <input
      id="keyInput"
      type="text"
      placeholder="Enter access key"
      autocomplete="off"
    >
    <button onclick="login()">LOGIN</button>
    <div class="status" id="loginStatus"></div>
  </div>

  <div id="dashboard" style="display:none">

    <!-- PREDICTION -->
    <div class="card">

      <div class="card-title">NEXT PREDICTION</div>

      <div class="target" id="targetIssue">
        Syncing...
      </div>

      <div class="thinking" id="thinking">
        <div class="thinking-text">AI ANALYSING</div>
        <div class="dots">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>

      <div
        class="prediction"
        id="prediction"
        style="display:none"
      >
        --
      </div>

      <div
        class="confidence"
        id="confidence"
      >
        --
      </div>

      <div
        class="analysis"
        id="analysis"
      >
        WAITING FOR LIVE DATA
      </div>

    </div>


    <!-- LIVE RESULT -->
    <div class="card">

      <div class="history-head">
        <div class="history-title">LIVE RESULT</div>
      </div>

      <div class="live-grid">

        <div class="live-box">
          <div class="live-label">CURRENT ISSUE</div>
          <div
            class="live-value"
            id="currentIssue"
          >
            --
          </div>
        </div>

        <div class="live-box">
          <div class="live-label">LAST NUMBER</div>
          <div
            class="live-value"
            id="lastNumber"
          >
            --
          </div>
        </div>

        <div class="live-box">
          <div class="live-label">RESULT</div>
          <div
            class="live-value"
            id="lastResult"
          >
            --
          </div>
        </div>

      </div>

    </div>


    <!-- HISTORY -->
    <div class="card">

      <div class="history-head">
        <div class="history-title">LIVE HISTORY</div>
        <div class="last">LAST 30</div>
      </div>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>ISSUE</th>
              <th>NUMBER</th>
              <th>RESULT</th>
              <th>AI</th>
              <th>W/L</th>
            </tr>
          </thead>

          <tbody id="historyBody">
            <tr>
              <td colspan="5" class="empty">
                Loading...
              </td>
            </tr>
          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>


<script>

const API = "";

let accessKey =
  localStorage.getItem("dy_ai_access_key") || "";

let deviceId =
  localStorage.getItem("dy_ai_device_id");

if(!deviceId){

  if(window.crypto && crypto.randomUUID){
    deviceId = crypto.randomUUID();
  }else{
    deviceId =
      "dev-" +
      Date.now().toString(36) +
      "-" +
      Math.random().toString(36).slice(2);
  }

  localStorage.setItem(
    "dy_ai_device_id",
    deviceId
  );
}

let lastTargetIssue = null;
let thinkingTarget = null;
let thinkingTimer = null;
let firstLoad = true;


/* -----------------------------
   HELPERS
----------------------------- */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function headers(){

  return {
    "X-Access-Key": accessKey,
    "X-Device-Id": deviceId,
    "Cache-Control": "no-cache"
  };

}


/* -----------------------------
   LOGIN
----------------------------- */

async function login(){

  const input =
    document.getElementById("keyInput");

  const status =
    document.getElementById("loginStatus");

  const key =
    input.value.trim();

  if(!key){

    status.textContent =
      "Please enter access key";

    return;
  }

  status.textContent =
    "Checking key...";

  try{

    const res =
      await fetch(
        API + "/api/key/check",
        {
          method:"GET",
          headers:{
            "X-Access-Key":key,
            "X-Device-Id":deviceId,
            "Cache-Control":"no-cache"
          },
          cache:"no-store"
        }
      );

    const data =
      await res.json();

    if(!res.ok || !data.ok){

      status.textContent =
        data.message ||
        "Invalid access key";

      return;
    }

    accessKey = key;

    localStorage.setItem(
      "dy_ai_access_key",
      accessKey
    );

    document.getElementById(
      "loginBox"
    ).style.display="none";

    document.getElementById(
      "dashboard"
    ).style.display="block";

    firstLoad = true;

    await loadState();

    startPolling();

  }catch(err){

    status.textContent =
      "Server connection error";

  }

}


/* -----------------------------
   AUTO LOGIN
----------------------------- */

async function autoLogin(){

  if(!accessKey) return;

  try{

    const res =
      await fetch(
        API + "/api/key/check",
        {
          headers:headers(),
          cache:"no-store"
        }
      );

    const data =
      await res.json();

    if(!res.ok || !data.ok){

      localStorage.removeItem(
        "dy_ai_access_key"
      );

      return;
    }

    document.getElementById(
      "loginBox"
    ).style.display="none";

    document.getElementById(
      "dashboard"
    ).style.display="block";

    await loadState();

    startPolling();

  }catch(e){

    // server may still be starting

  }

}


/* -----------------------------
   THINKING EFFECT
----------------------------- */

function showThinking(target){

  clearTimeout(thinkingTimer);

  thinkingTarget = target;

  document.getElementById(
    "thinking"
  ).style.display="block";

  document.getElementById(
    "prediction"
  ).style.display="none";

  thinkingTimer =
    setTimeout(()=>{

      thinkingTarget = null;

      document.getElementById(
        "thinking"
      ).style.display="none";

      loadState();

    },3000);

}


/* -----------------------------
   PREDICTION
----------------------------- */

function renderPrediction(model){

  const prediction =
    document.getElementById("prediction");

  const confidence =
    document.getElementById("confidence");

  const analysis =
    document.getElementById("analysis");

  if(!model){

    prediction.style.display="none";

    confidence.textContent="";

    analysis.textContent =
      "WAITING FOR LIVE DATA";

    return;
  }

  const value =
    String(
      model.prediction ||
      model.result ||
      ""
    ).toUpperCase();

  const target =
    model.targetIssue ||
    model.target_issue ||
    "";

  if(!value || !target){

    prediction.style.display="none";

    confidence.textContent="";

    analysis.textContent =
      "SYNCING LIVE DATA";

    return;
  }

  if(
    thinkingTarget === target
  ){

    return;
  }

  prediction.textContent =
    value;

  prediction.className =
    "prediction " +
    (
      value === "BIG"
        ? "big"
        : value === "SMALL"
          ? "small"
          : ""
    );

  prediction.style.display="block";

  const conf =
    model.confidence;

  confidence.textContent =
    conf !== undefined &&
    conf !== null
      ? "Confidence " + esc(conf) + "%"
      : "";

  analysis.textContent =
    String(
      model.classification ||
      model.analysis ||
      model.reason ||
      "FULL AI ANALYSIS"
    ).toUpperCase();

}


/* -----------------------------
   LIVE RESULT
----------------------------- */

function renderLive(data){

  const current =
    data.currentIssue ||
    data.current_issue ||
    data.current?.issueNumber ||
    "--";

  document.getElementById(
    "currentIssue"
  ).textContent = current;

  const history =
    Array.isArray(data.history)
      ? data.history
      : [];

  if(!history.length){

    document.getElementById(
      "lastNumber"
    ).textContent="--";

    document.getElementById(
      "lastResult"
    ).textContent="--";

    return;
  }

  const latest =
    history
      .slice()
      .sort(
        (a,b)=>
          compareIssue(
            b.issueNumber ||
            b.issue ||
            b.targetIssue,

            a.issueNumber ||
            a.issue ||
            a.targetIssue
          )
      )[0];

  if(!latest) return;

  const number =
    latest.number ??
    latest.resultNumber ??
    latest.actual_number ??
    "--";

  const result =
    getSide(number);

  document.getElementById(
    "lastNumber"
  ).textContent = number;

  const resultEl =
    document.getElementById(
      "lastResult"
    );

  resultEl.textContent =
    result;

  resultEl.className =
    "live-value " +
    (
      result === "BIG"
        ? "live-big"
        : result === "SMALL"
          ? "live-small"
          : ""
    );

}


/* -----------------------------
   HISTORY
----------------------------- */

function renderHistory(data){

  const body =
    document.getElementById(
      "historyBody"
    );

  const history =
    Array.isArray(data.history)
      ? data.history
      : [];

  if(!history.length){

    body.innerHTML =
      `<tr>
        <td colspan="5" class="empty">
          No live history
        </td>
      </tr>`;

    return;
  }

  const predictionRecords =
    Array.isArray(
      data.predictions
    )
      ? data.predictions
      : [];

  const rows =
    history
      .slice()
      .sort(
        (a,b)=>
          compareIssue(
            b.issueNumber ||
            b.issue,

            a.issueNumber ||
            a.issue
          )
      )
      .slice(0,30);

  body.innerHTML =
    rows.map(row=>{

      const issue =
        String(
          row.issueNumber ||
          row.issue ||
          ""
        );

      const number =
        row.number ??
        row.resultNumber ??
        row.actual_number ??
        "";

      const result =
        getSide(number);

      const record =
        findPrediction(
          predictionRecords,
          issue
        );

      let ai = "—";
      let wl = "—";
      let wlClass = "";

      if(record){

        ai =
          String(
            record.prediction ||
            ""
          ).toUpperCase();

        const actual =
          String(
            record.actual_result ||
            record.actualResult ||
            ""
          ).toUpperCase();

        if(
          actual === "WIN" ||
          actual === "LOSS"
        ){

          wl = actual;

          wlClass =
            actual === "WIN"
              ? "win"
              : "loss";

        }else{

          wl="—";
          wlClass="pending";

        }

      }

      const resultClass =
        result === "BIG"
          ? "result-big"
          : "result-small";

      return `
        <tr>

          <td class="issue">
            ${esc(issue)}
          </td>

          <td>
            ${esc(number)}
          </td>

          <td class="${resultClass}">
            ${esc(result)}
          </td>

          <td>
            ${esc(ai || "—")}
          </td>

          <td class="${wlClass}">
            ${esc(wl)}
          </td>

        </tr>
      `;

    }).join("");

}


/* -----------------------------
   FIND PREDICTION
----------------------------- */

function findPrediction(records, issue){

  if(!Array.isArray(records))
    return null;

  return records.find(r=>{

    const target =
      String(
        r.target_issue ||
        r.targetIssue ||
        ""
      );

    return target === String(issue);

  }) || null;

}


/* -----------------------------
   SIDE
----------------------------- */

function getSide(number){

  const n =
    parseInt(number,10);

  if(!Number.isInteger(n))
    return "—";

  if(n >= 0 && n <= 4)
    return "SMALL";

  if(n >= 5 && n <= 9)
    return "BIG";

  return "—";

}


/* -----------------------------
   ISSUE COMPARISON
   IMPORTANT:
   NEVER convert issue IDs to Number
----------------------------- */

function normalizeIssue(value){

  if(value === null ||
     value === undefined)
    return "";

  return String(value)
    .trim()
    .replace(/^0+/,"") || "0";

}


function compareIssue(a,b){

  const A =
    normalizeIssue(a);

  const B =
    normalizeIssue(b);

  if(A.length !== B.length)
    return A.length - B.length;

  if(A === B)
    return 0;

  return A > B ? 1 : -1;

}


/* -----------------------------
   LOAD STATE
----------------------------- */

async function loadState(){

  try{

    const res =
      await fetch(
        API + "/api/state?t=" +
        Date.now(),
        {
          headers:headers(),
          cache:"no-store"
        }
      );

    if(res.status === 401 ||
       res.status === 403){

      localStorage.removeItem(
        "dy_ai_access_key"
      );

      location.reload();

      return;
    }

    const data =
      await res.json();

    if(!res.ok || !data.ok){

      document.getElementById(
        "analysis"
      ).textContent =
        data.message ||
        "SYNC ERROR";

      return;
    }

    const model =
      data.model || {};

    const target =
      model.targetIssue ||
      model.target_issue ||
      null;


    /*
      IMPORTANT:

      Sirf NEW target par
      3-second visual thinking.

      Polling ko block nahi karte.
    */

    if(
      target &&
      target !== lastTargetIssue &&
      !firstLoad
    ){

      lastTargetIssue =
        target;

      showThinking(target);

    }else if(
      target &&
      firstLoad
    ){

      lastTargetIssue =
        target;

    }


    renderLive(data);

    renderHistory(data);


    if(
      thinkingTarget !== target
    ){

      renderPrediction(model);

    }


    firstLoad = false;

  }catch(err){

    document.getElementById(
      "analysis"
    ).textContent =
      "CONNECTING...";

  }

}


/* -----------------------------
   POLLING
----------------------------- */

let pollStarted = false;

function startPolling(){

  if(pollStarted)
    return;

  pollStarted = true;

  /*
    Fast UI refresh.
    Backend prediction logic remains server-side.
  */

  setInterval(
    loadState,
    1000
  );

}


/* -----------------------------
   ENTER KEY LOGIN
----------------------------- */

document
  .getElementById("keyInput")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter")
        login();

    }
  );


/* -----------------------------
   START
----------------------------- */

if(accessKey){

  autoLogin();

}

</script>

</body>
</html>
