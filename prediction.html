<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>DY AI Prediction</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#05070d;
  color:white;
  font-family:Arial,sans-serif;
}

.container{
  max-width:520px;
  margin:auto;
  padding:18px;
}

.header{
  text-align:center;
  margin-bottom:18px;
}

.header h1{
  font-size:27px;
  margin:5px 0;
  font-weight:900;
}

.header p{
  font-size:11px;
  opacity:.5;
}

.status{
  margin-top:9px;
  font-size:12px;
  font-weight:800;
}

.live{
  color:#55ff91;
}

.error{
  color:#ff5c5c;
}

.card{
  background:#0d111c;
  border:1px solid #20283b;
  border-radius:20px;
  padding:20px;
  margin-bottom:14px;
}

.label{
  font-size:11px;
  opacity:.55;
  font-weight:800;
  letter-spacing:1px;
  margin-bottom:10px;
}

.period{
  font-size:19px;
  font-weight:900;
  word-break:break-all;
}

.analysis{
  min-height:155px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.analysisText{
  font-size:14px;
  font-weight:800;
  letter-spacing:1px;
}

.count{
  font-size:58px;
  font-weight:900;
  margin-top:8px;
}

.loader{
  width:42px;
  height:42px;
  border-radius:50%;
  border:3px solid #252b3b;
  border-top-color:white;
  margin-top:14px;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.prediction{
  min-height:100px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:39px;
  font-weight:1000;
}

.big{
  color:#58ff91;
}

.small{
  color:#5db5ff;
}

.clear{
  color:#ffbd55;
}

.wait{
  opacity:.4;
  font-size:22px;
}

.history{
  max-height:390px;
  overflow-y:auto;
}

.row{
  display:grid;
  grid-template-columns:1fr 45px 70px;
  gap:8px;
  padding:13px 2px;
  border-bottom:1px solid #1b2130;
  font-size:13px;
}

.num{
  text-align:center;
  font-weight:900;
}

.size{
  text-align:right;
  font-weight:900;
}

.empty{
  text-align:center;
  padding:25px;
  opacity:.4;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>
DY AI PREDICTION
</h1>

<p>
LIVE WIN GO 1 MIN ANALYSIS
</p>

<div
id="status"
class="status"
>
● CONNECTING...
</div>

</div>


<div class="card">

<div class="label">
CURRENT PERIOD
</div>

<div
id="current"
class="period"
>
--
</div>

</div>


<div class="card">

<div class="label">
PREDICTION PERIOD
</div>

<div
id="next"
class="period"
>
--
</div>

</div>


<div class="card analysis">

<div
id="analysisText"
class="analysisText"
>
WAITING FOR NEW PERIOD...
</div>

<div
id="count"
class="count"
>
</div>

<div
id="loader"
class="loader"
style="display:none"
>
</div>

</div>


<div class="card">

<div class="label">
PREDICTION
</div>

<div
id="prediction"
class="prediction wait"
>
WAITING
</div>

</div>


<div class="card">

<div class="label">
HISTORY
</div>

<div
id="history"
class="history"
>
<div class="empty">
Loading...
</div>
</div>

</div>

</div>


<script>

function escapeHTML(v){

  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function renderHistory(rows){

  const box =
    document.getElementById(
      "history"
    );

  if(
    !Array.isArray(rows) ||
    !rows.length
  ){

    box.innerHTML =
      `<div class="empty">
        No history available
      </div>`;

    return;
  }


  box.innerHTML =
    rows.map(row => {

      const size =
        row.size ||
        (
          Number(row.number) <= 4
            ? "SMALL"
            : "BIG"
        );

      const cls =
        size === "BIG"
          ? "big"
          : "small";

      return `
        <div class="row">

          <div>
            ${escapeHTML(
              row.issueNumber
            )}
          </div>

          <div class="num">
            ${escapeHTML(
              row.number
            )}
          </div>

          <div class="size ${cls}">
            ${size}
          </div>

        </div>
      `;

    }).join("");

}


function render(data){

  document.getElementById(
    "current"
  ).textContent =
    data.currentPeriod || "--";


  document.getElementById(
    "next"
  ).textContent =
    data.predictionPeriod ||
    data.nextPeriod ||
    "--";


  const status =
    document.getElementById(
      "status"
    );


  if(
    data.sourceStatus ===
    "LIVE"
  ){

    status.textContent =
      "● LIVE API";

    status.className =
      "status live";

  }else{

    status.textContent =
      "● " +
      (
        data.error ||
        "API ERROR"
      );

    status.className =
      "status error";

  }


  const analysis =
    data.analysis || {};


  const text =
    document.getElementById(
      "analysisText"
    );


  const count =
    document.getElementById(
      "count"
    );


  const loader =
    document.getElementById(
      "loader"
    );


  if(
    analysis.active
  ){

    text.textContent =
      analysis.message ||
      "ANALYZING...";

    count.textContent =
      analysis.remaining;

    loader.style.display =
      "block";

  }else{

    text.textContent =
      analysis.message ||
      "WAITING FOR NEW PERIOD...";

    count.textContent =
      "";

    loader.style.display =
      "none";

  }


  const p =
    document.getElementById(
      "prediction"
    );


  if(
    analysis.active
  ){

    p.textContent =
      "ANALYZING...";

    p.className =
      "prediction wait";

  }else{

    const value =
      analysis.prediction ||
      "WAITING";

    p.textContent =
      value;


    if(value === "BIG"){

      p.className =
        "prediction big";

    }else if(value === "SMALL"){

      p.className =
        "prediction small";

    }else if(
      value ===
      "NO CLEAR SIGNAL"
    ){

      p.className =
        "prediction clear";

    }else{

      p.className =
        "prediction wait";

    }

  }


  renderHistory(
    data.history || []
  );

}


async function load(){

  try{

    const response =
      await fetch(
        "/api/state?_=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    render(data);

  }catch{

    const status =
      document.getElementById(
        "status"
      );

    status.textContent =
      "● CONNECTION ERROR";

    status.className =
      "status error";

  }

}


load();

setInterval(
  load,
  1000
);

</script>

</body>
</html>
