<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>DY AI Wingo</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:12px;
  min-height:100vh;
  background:
    radial-gradient(
      circle at top,
      #182e57,
      #050914 55%,
      #020308
    );
  color:#fff;
  font-family:Arial,sans-serif;
}

.wrap{
  width:100%;
  max-width:650px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 4px 18px;
}

.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:5px;
}

.status{
  padding:9px 14px;
  border-radius:30px;
  background:#071326;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
}

.online{
  color:#45ffba;
}

.offline{
  color:#ff6060;
}

.card{
  background:
    linear-gradient(
      145deg,
      #0a101e,
      #050914
    );
  border:1px solid #1d3358;
  border-radius:24px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:
    0 15px 45px #0008;
}

.label{
  color:#697893;
  font-size:10px;
  font-weight:900;
  letter-spacing:5px;
  margin-bottom:16px;
}

.period{
  font-size:22px;
  font-weight:900;
  word-break:break-all;
}

.sub{
  color:#687691;
  font-size:10px;
  margin-top:11px;
  word-break:break-all;
}

.result{
  display:flex;
  align-items:center;
  gap:23px;
}

.orb{
  width:120px;
  height:120px;
  min-width:120px;
  border-radius:50%;
  border:3px solid #29416b;
  background:
    radial-gradient(
      circle,
      #0b1929,
      #02050b
    );
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    0 0 35px #000;
}

.number{
  font-size:43px;
  font-weight:900;
}

.resultName{
  font-size:27px;
  font-weight:900;
}

.big{
  color:#ffb63d;
}

.small{
  color:#35d9ff;
}

.predictionBox{
  text-align:center;
}

.predictionValue{
  font-size:47px;
  font-weight:900;
  letter-spacing:3px;
  margin:16px 0;
}

.wait{
  color:#ffb63d;
}

.target{
  color:#6f7d96;
  font-size:10px;
  letter-spacing:3px;
  word-break:break-all;
}

.confRow{
  display:flex;
  justify-content:space-between;
  margin-top:22px;
  color:#7c8aa2;
  font-size:10px;
  font-weight:900;
}

.progress{
  width:100%;
  height:9px;
  margin-top:9px;
  background:#02040a;
  border-radius:20px;
  overflow:hidden;
}

.progressFill{
  width:0%;
  height:100%;
  background:
    linear-gradient(
      90deg,
      #15c8ff,
      #8056ff
    );
  transition:.15s;
}

.message{
  text-align:center;
  margin-top:16px;
  color:#8995aa;
  font-size:11px;
  font-weight:900;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.box{
  padding:15px;
  border:1px solid #1b2e4d;
  border-radius:17px;
  background:#050914;
}

.boxTitle{
  color:#697792;
  font-size:9px;
  letter-spacing:3px;
  margin-bottom:8px;
}

.boxValue{
  font-size:15px;
  font-weight:900;
  word-break:break-word;
}

.row{
  display:grid;
  grid-template-columns:1fr 45px 70px;
  align-items:center;
  gap:8px;
  padding:12px 0;
  border-bottom:1px solid #172237;
}

.row:last-child{
  border-bottom:0;
}

.issue{
  color:#71809a;
  font-size:9px;
  word-break:break-all;
}

.rowNumber{
  text-align:center;
  font-size:18px;
  font-weight:900;
}

.rowResult{
  text-align:right;
  font-size:9px;
  font-weight:900;
}

.login{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#02040a;
}

.loginBox{
  width:100%;
  max-width:400px;
  padding:28px;
  border:1px solid #22395f;
  border-radius:24px;
  background:#080d18;
  box-shadow:0 20px 70px #000;
}

.loginTitle{
  font-size:28px;
  font-weight:900;
  letter-spacing:2px;
}

.loginSub{
  color:#748099;
  font-size:12px;
  margin-top:7px;
  margin-bottom:12px;
}

input{
  width:100%;
  padding:14px;
  margin:8px 0 12px;
  background:#02050a;
  color:#fff;
  border:1px solid #273d60;
  border-radius:13px;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:13px;
  background:
    linear-gradient(
      90deg,
      #00afea,
      #8055ff
    );
  color:#fff;
  font-weight:900;
}

.error{
  color:#ff6262;
  text-align:center;
  font-size:11px;
  margin-top:10px;
}

.hidden{
  display:none !important;
}

@media(max-width:420px){

  body{
    padding:9px;
  }

  .card{
    padding:17px;
  }

  .orb{
    width:100px;
    height:100px;
    min-width:100px;
  }

  .number{
    font-size:35px;
  }

  .resultName{
    font-size:22px;
  }

  .predictionValue{
    font-size:40px;
  }

  .period{
    font-size:18px;
  }
}

</style>

</head>

<body>

<!-- LOGIN -->

<div
  id="login"
  class="login"
>

  <div class="loginBox">

    <div class="loginTitle">
      DY AI WINGO
    </div>

    <div class="loginSub">
      Enter your access key
    </div>

    <input
      id="accessKey"
      type="text"
      placeholder="Access Key"
      autocomplete="off"
    >

    <button onclick="login()">
      ENTER DASHBOARD
    </button>

    <div
      id="loginError"
      class="error"
    ></div>

  </div>

</div>


<!-- APP -->

<div
  id="app"
  class="wrap hidden"
>

  <div class="top">

    <div class="logo">
      DY AI
    </div>

    <div
      id="status"
      class="status offline"
    >
      OFFLINE
    </div>

  </div>


  <!-- PERIOD -->

  <div class="card">

    <div class="label">
      CURRENT PERIOD
    </div>

    <div
      id="currentPeriod"
      class="period"
    >
      —
    </div>

    <div class="sub">
      NEXT PERIOD:
      <span id="nextPeriod">
        —
      </span>
    </div>

  </div>


  <!-- RESULT -->

  <div class="card">

    <div class="label">
      LATEST RESULT
    </div>

    <div class="result">

      <div class="orb">

        <div
          id="latestNumber"
          class="number"
        >
          —
        </div>

      </div>

      <div>

        <div
          id="resultName"
          class="resultName"
        >
          WAIT
        </div>

        <div
          id="resultType"
        >
          —
        </div>

      </div>

    </div>

  </div>


  <!-- PREDICTION -->

  <div class="card">

    <div class="label">
      AI ML PREDICTION
    </div>

    <div class="predictionBox">

      <div
        id="prediction"
        class="predictionValue wait"
      >
        WAIT
      </div>

      <div class="target">

        TARGET PERIOD:

        <span id="targetPeriod">
          —
        </span>

      </div>

      <div class="confRow">

        <span>
          AI CONFIDENCE
        </span>

        <span id="confidence">
          0%
        </span>

      </div>

      <div class="progress">

        <div
          id="progressFill"
          class="progressFill"
        ></div>

      </div>

      <div
        id="message"
        class="message"
      >
        WAITING FOR LIVE DATA...
      </div>

    </div>

  </div>


  <!-- DIAGNOSTICS -->

  <div class="card">

    <div class="label">
      MODEL DIAGNOSTICS
    </div>

    <div class="grid">

      <div class="box">

        <div class="boxTitle">
          MODEL
        </div>

        <div
          id="model"
          class="boxValue"
        >
          —
        </div>

      </div>

      <div class="box">

        <div class="boxTitle">
          MODE
        </div>

        <div
          id="mode"
          class="boxValue"
        >
          —
        </div>

      </div>

      <div class="box">

        <div class="boxTitle">
          EVIDENCE
        </div>

        <div
          id="evidence"
          class="boxValue"
        >
          —
        </div>

      </div>

      <div class="box">

        <div class="boxTitle">
          SAMPLE
        </div>

        <div
          id="sample"
          class="boxValue"
        >
          0
        </div>

      </div>

    </div>

  </div>


  <!-- HISTORY -->

  <div class="card">

    <div class="label">
      RECENT RESULTS
    </div>

    <div id="history"></div>

  </div>

</div>


<script>

const ACCESS_STORAGE =
  "DY_AI_ACCESS_KEY_V6";

const DEVICE_STORAGE =
  "DY_AI_DEVICE_ID_V6";


function getDeviceId(){

  let id =
    localStorage.getItem(
      DEVICE_STORAGE
    );

  if(!id){

    if(
      window.crypto &&
      crypto.randomUUID
    ){
      id =
        crypto.randomUUID();
    }else{
      id =
        "device-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2);
    }

    localStorage.setItem(
      DEVICE_STORAGE,
      id
    );
  }

  return id;
}


/* LOGIN */

async function login(){

  const key =
    document
      .getElementById(
        "accessKey"
      )
      .value
      .trim();

  const error =
    document
      .getElementById(
        "loginError"
      );

  error.textContent = "";

  if(!key){
    error.textContent =
      "Enter access key";
    return;
  }

  try{

    const response =
      await fetch(
        "/api/key/check",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              accessKey:key,
              deviceId:
                getDeviceId()
            })
        }
      );

    const data =
      await response.json();

    if(!data.ok){
      error.textContent =
        data.message ||
        "Access denied";
      return;
    }

    localStorage.setItem(
      ACCESS_STORAGE,
      key
    );

    showDashboard();

  }catch(err){

    error.textContent =
      "Server connection failed";
  }
}


/* SHOW */

function showDashboard(){

  document
    .getElementById("login")
    .classList
    .add("hidden");

  document
    .getElementById("app")
    .classList
    .remove("hidden");

  updateState();
}


/* ESCAPE */

function escapeHTML(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char])
  );
}


/* RENDER */

function render(data){

  const status =
    document.getElementById(
      "status"
    );

  status.textContent =
    data.online
      ? "ONLINE"
      : "OFFLINE";

  status.className =
    "status " +
    (
      data.online
        ? "online"
        : "offline"
    );


  document.getElementById(
    "currentPeriod"
  ).textContent =
    data.currentPeriod ||
    "—";


  document.getElementById(
    "nextPeriod"
  ).textContent =
    data.nextPeriod ||
    "—";


  const number =
    Number.isInteger(
      data.latestNumber
    )
      ? data.latestNumber
      : null;


  document.getElementById(
    "latestNumber"
  ).textContent =
    number === null
      ? "—"
      : number;


  const result =
    data.latestResult ||
    "WAIT";


  const resultName =
    document.getElementById(
      "resultName"
    );

  resultName.textContent =
    result;

  resultName.className =
    "resultName " +
    (
      result === "BIG"
        ? "big"
        : result === "SMALL"
          ? "small"
          : ""
    );


  const resultType =
    document.getElementById(
      "resultType"
    );

  resultType.textContent =
    result;

  resultType.className =
    result === "BIG"
      ? "big"
      : result === "SMALL"
        ? "small"
        : "";


  const prediction =
    document.getElementById(
      "prediction"
    );

  const target =
    document.getElementById(
      "targetPeriod"
    );

  const confidence =
    document.getElementById(
      "confidence"
    );

  const fill =
    document.getElementById(
      "progressFill"
    );

  const message =
    document.getElementById(
      "message"
    );


  /*
    REAL PREDICTION
  */

  if(data.prediction){

    prediction.textContent =
      data.prediction.result;

    prediction.className =
      "predictionValue " +
      (
        data.prediction.result ===
        "BIG"
          ? "big"
          : "small"
      );

    target.textContent =
      data.prediction.issue;

    const c =
      Number(
        data.prediction.confidence
      ) || 0;

    confidence.textContent =
      c + "%";

    fill.style.width =
      c + "%";

    message.textContent =
      "AI PREDICTION READY";

  }

  /*
    SKIP
  */

  else if(
    data.cycle &&
    data.cycle.mode ===
      "SKIP"
  ){

    prediction.textContent =
      "SKIP";

    prediction.className =
      "predictionValue wait";

    target.textContent =
      data.currentPeriod ||
      "—";

    confidence.textContent =
      "0%";

    fill.style.width =
      "0%";

    message.textContent =
      "SKIP ROUND " +
      data.cycle.skipRound +
      " / " +
      data.cycle.skipTotal;

  }

  /*
    4 SECOND ANALYSIS
  */

  else if(
    data.analysisSession &&
    data.analysisSession.active
  ){

    const total =
      Number(
        data.analysisSession.total
      ) || 4000;

    const elapsed =
      Number(
        data.analysisSession.elapsed
      ) || 0;

    const progress =
      Math.min(
        100,
        Math.round(
          elapsed /
          total *
          100
        )
      );

    prediction.textContent =
      "ANALYZING";

    prediction.className =
      "predictionValue wait";

    target.textContent =
      data.analysisSession.issue ||
      data.currentPeriod ||
      "—";

    /*
      Analysis progress only.
    */

    confidence.textContent =
      progress + "%";

    fill.style.width =
      progress + "%";

    message.textContent =
      "AI ANALYSIS " +
      progress +
      "%";

  }

  /*
    WAIT
  */

  else{

    prediction.textContent =
      "WAIT";

    prediction.className =
      "predictionValue wait";

    target.textContent =
      "—";

    confidence.textContent =
      "0%";

    fill.style.width =
      "0%";

    message.textContent =
      data.online
        ? "WAITING FOR NEXT ROUND..."
        : "WAITING FOR LIVE DATA...";
  }


  document.getElementById(
    "model"
  ).textContent =
    data.modelVersion ||
    "DY-AI-V6";


  document.getElementById(
    "mode"
  ).textContent =
    data.cycle
      ? data.cycle.mode
      : "—";


  document.getElementById(
    "sample"
  ).textContent =
    data.recentResults
      ? data.recentResults.length
      : 0;


  document.getElementById(
    "evidence"
  ).textContent =
    data.prediction
      ? "SUPPORTED"
      : "—";


  const history =
    document.getElementById(
      "history"
    );

  const results =
    data.recentResults ||
    [];


  history.innerHTML =
    results
      .map(item => {

        const r =
          item.result || "—";

        const cls =
          r.toLowerCase();

        return `
          <div class="row">

            <div class="issue">
              ${escapeHTML(
                item.issue
              )}
            </div>

            <div
              class="rowNumber ${cls}"
            >
              ${
                Number.isInteger(
                  item.number
                )
                  ? item.number
                  : "—"
              }
            </div>

            <div
              class="rowResult ${cls}"
            >
              ${escapeHTML(r)}
            </div>

          </div>
        `;
      })
      .join("");


  if(!results.length){
    history.innerHTML =
      `
      <div class="message">
        No results
      </div>
      `;
  }
}


/* UPDATE */

async function updateState(){

  try{

    const response =
      await fetch(
        "/api/state",
        {
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    render(data);

  }catch(err){

    document
      .getElementById(
        "status"
      )
      .textContent =
        "OFFLINE";
  }
}


/* 1 SECOND REFRESH */

setInterval(
  updateState,
  1000
);


/* AUTO LOGIN */

if(
  localStorage.getItem(
    ACCESS_STORAGE
  )
){
  showDashboard();
}

</script>

</body>

</html>
