<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>DY AI WinGo</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  padding:12px;
  color:#fff;
  background:
    radial-gradient(
      circle at 50% -10%,
      #202a4d,
      #080b14 45%,
      #020306
    );
  font-family:Arial,sans-serif;
}

.wrap{
  width:100%;
  max-width:700px;
  margin:auto;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 4px 22px;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:8px;
}

.sub{
  margin-top:7px;
  color:#68728d;
  font-size:10px;
  letter-spacing:4px;
}

.online{
  display:flex;
  align-items:center;
  gap:7px;
  color:#8992a9;
  font-size:10px;
  font-weight:900;
}

.dot{
  width:11px;
  height:11px;
  border-radius:50%;
  background:#ff315d;
}

.dot.ok{
  background:#2cff9f;
  box-shadow:0 0 15px #2cff9f;
}

.card{
  margin-bottom:15px;
  padding:20px;
  border:1px solid #202b45;
  border-radius:25px;
  background:rgba(8,13,25,.97);
  box-shadow:0 14px 40px rgba(0,0,0,.3);
}

.label{
  margin-bottom:15px;
  color:#68728d;
  font-size:10px;
  font-weight:900;
  letter-spacing:4px;
}

.login{
  display:none;
}

input{
  width:100%;
  margin-bottom:12px;
  padding:16px;
  outline:none;
  border:1px solid #273654;
  border-radius:14px;
  color:#fff;
  background:#050914;
  font-size:15px;
}

button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:14px;
  color:#fff;
  background:#ff3c68;
  font-weight:900;
}

.error{
  display:none;
  margin-bottom:14px;
  padding:13px;
  border:1px solid #713149;
  border-radius:14px;
  color:#ff7594;
  background:#29101a;
  font-size:12px;
  font-weight:800;
}

.hide{
  display:none!important;
}

.period{
  color:#fff;
  font-size:25px;
  font-weight:900;
  letter-spacing:2px;
  word-break:break-all;
}

.next{
  margin-top:12px;
  color:#69738e;
  font-size:11px;
  font-weight:800;
}

.result{
  display:flex;
  align-items:center;
  gap:20px;
}

.ball{
  display:flex;
  width:120px;
  height:120px;
  align-items:center;
  justify-content:center;
  border:2px solid #263551;
  border-radius:50%;
  background:#02050a;
  font-size:40px;
  font-weight:900;
}

.number{
  font-size:29px;
  font-weight:900;
}

.type{
  margin-top:8px;
  color:#68738e;
  font-size:12px;
  font-weight:900;
}

.big{
  color:#ffbe50!important;
  text-shadow:0 0 18px rgba(255,190,80,.45);
}

.small{
  color:#4bdcff!important;
  text-shadow:0 0 18px rgba(75,220,255,.45);
}

.prediction{
  text-align:center;
  margin:12px 0;
  font-size:52px;
  font-weight:900;
  letter-spacing:3px;
}

.wait{
  color:#ffbf51;
}

.target{
  text-align:center;
  color:#68738e;
  font-size:10px;
  font-weight:900;
}

.conf{
  display:flex;
  justify-content:space-between;
  margin:20px 0 8px;
  color:#69738e;
  font-size:10px;
  font-weight:900;
}

.bar{
  height:10px;
  overflow:hidden;
  border-radius:20px;
  background:#03050a;
}

.fill{
  width:0;
  height:100%;
  border-radius:20px;
  background:linear-gradient(
    90deg,
    #ff3967,
    #ffc151
  );
  transition:.3s;
}

.status{
  min-height:18px;
  margin-top:14px;
  text-align:center;
  color:#727c96;
  font-size:12px;
  font-weight:800;
}

.skip{
  display:none;
  margin-top:13px;
  padding:12px;
  border:1px solid #55431d;
  border-radius:13px;
  color:#ffc866;
  background:#191309;
  text-align:center;
  font-size:11px;
  font-weight:900;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  padding:15px;
  border:1px solid #1c2942;
  border-radius:15px;
  background:#070b14;
}

.stat small{
  display:block;
  margin-bottom:7px;
  color:#626d88;
  font-size:8px;
  letter-spacing:2px;
}

.stat b{
  font-size:15px;
}

.history{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.h{
  display:flex;
  width:42px;
  height:42px;
  align-items:center;
  justify-content:center;
  border:1px solid #202d49;
  border-radius:11px;
  background:#070c16;
  font-size:15px;
  font-weight:900;
}

@media(max-width:450px){

  .logo{
    font-size:23px;
  }

  .ball{
    width:105px;
    height:105px;
  }

  .prediction{
    font-size:43px;
  }

}

</style>

</head>

<body>

<div class="wrap">

<header>

<div>

<div class="logo">
DY AI
</div>

<div class="sub">
WINGO 1 MINUTE
</div>

</div>

<div class="online">

<span
  id="dot"
  class="dot"
></span>

<span id="online">
OFFLINE
</span>

</div>

</header>


<div
  id="error"
  class="error"
></div>


<div
  id="login"
  class="card login"
>

<div class="label">
PREMIUM ACCESS
</div>

<input
  id="key"
  placeholder="ENTER ACCESS KEY"
  autocomplete="off"
>

<button
  onclick="login()"
>
UNLOCK AI
</button>

</div>


<div
  id="app"
  class="hide"
>


<div class="card">

<div class="label">
CURRENT PERIOD
</div>

<div
  id="period"
  class="period"
>
—
</div>

<div
  id="next"
  class="next"
>
NEXT PERIOD: —
</div>

</div>


<div class="card">

<div class="label">
LATEST RESULT
</div>

<div class="result">

<div
  id="ball"
  class="ball"
>
—
</div>

<div>

<div
  id="number"
  class="number"
>
—
</div>

<div
  id="type"
  class="type"
>
Waiting...
</div>

</div>

</div>

</div>


<div class="card">

<div class="label">
AI PREMIUM PREDICTION
</div>

<div
  id="prediction"
  class="prediction wait"
>
WAIT
</div>

<div
  id="target"
  class="target"
>
TARGET PERIOD: —
</div>

<div class="conf">

<span>
AI CONFIDENCE
</span>

<span id="confidence">
0%
</span>

</div>

<div class="bar">

<div
  id="fill"
  class="fill"
></div>

</div>

<div
  id="status"
  class="status"
>
WAITING FOR LIVE DATA...
</div>

<div
  id="skip"
  class="skip"
></div>

</div>


<div class="card">

<div class="label">
AI ANALYSIS
</div>

<div class="grid">

<div class="stat">
<small>MODEL</small>
<b id="model">—</b>
</div>

<div class="stat">
<small>QUALITY</small>
<b id="quality">—</b>
</div>

<div class="stat">
<small>SKIP ROUND</small>
<b id="skipRound">0</b>
</div>

<div class="stat">
<small>SKIP LEFT</small>
<b id="skipLeft">0</b>
</div>

<div class="stat">
<small>SAMPLE</small>
<b id="sample">0</b>
</div>

<div class="stat">
<small>AI SCORE</small>
<b id="score">—</b>
</div>

</div>

</div>


<div class="card">

<div class="label">
LAST 10 RESULTS
</div>

<div
  id="history"
  class="history"
></div>

</div>

</div>

</div>


<script>

const KEY_STORE =
  "DY_AI_ACCESS_KEY_V5";

const DEVICE_STORE =
  "DY_AI_DEVICE_ID_V5";


let key =
  localStorage.getItem(
    KEY_STORE
  ) || "";


let device =
  localStorage.getItem(
    DEVICE_STORE
  );


function makeDevice(){

  if(
    crypto &&
    crypto.randomUUID
  ){
    return crypto.randomUUID();
  }

  return (
    "DY-" +
    Math.random()
      .toString(36)
      .slice(2) +
    Date.now()
  );
}


if(!device){

  device =
    makeDevice();

  localStorage.setItem(
    DEVICE_STORE,
    device
  );
}


function $(id){

  return document.getElementById(
    id
  );

}


function error(text){

  $("error")
    .textContent =
    text;

  $("error")
    .style.display =
    "block";

}


function clearError(){

  $("error")
    .style.display =
    "none";

}


function showLogin(){

  $("login")
    .style.display =
    "block";

  $("app")
    .classList.add(
      "hide"
    );

}


function showApp(){

  $("login")
    .style.display =
    "none";

  $("app")
    .classList.remove(
      "hide"
    );

}


async function login(){

  clearError();

  const entered =
    $("key")
      .value
      .trim();

  if(!entered){

    error(
      "ACCESS KEY ENTER KARO."
    );

    return;
  }

  try{

    const r =
      await fetch(
        "/api/key/check",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              key:entered,
              deviceId:device
            })
        }
      );

    const data =
      await r.json();

    if(!data.ok){

      error(
        data.error ||
        "INVALID KEY"
      );

      return;
    }

    key =
      entered;

    localStorage.setItem(
      KEY_STORE,
      key
    );

    showApp();

    load();

  }catch(e){

    error(
      "SERVER CONNECTION FAILED."
    );

  }

}


async function load(){

  if(!key){

    showLogin();

    return;
  }

  try{

    const r =
      await fetch(
        "/api/state?t=" +
        Date.now(),
        {
          cache:"no-store",

          headers:{
            "X-Access-Key":
              key,

            "X-Device-ID":
              device
          }
        }
      );

    const data =
      await r.json();

    if(
      r.status === 403
    ){

      localStorage.removeItem(
        KEY_STORE
      );

      key = "";

      showLogin();

      error(
        data.error ||
        "ACCESS DENIED"
      );

      return;
    }

    if(!data.ok){

      error(
        data.error ||
        "LIVE DATA ERROR"
      );

      return;
    }

    clearError();

    render(data);

  }catch(e){

    $("online")
      .textContent =
      "OFFLINE";

    $("dot")
      .classList.remove(
        "ok"
      );

  }

}


function render(data){

  const source =
    data.source || {};

  if(source.ok){

    $("online")
      .textContent =
      "ONLINE";

    $("dot")
      .classList.add(
        "ok"
      );

  }else{

    $("online")
      .textContent =
      "OFFLINE";

    $("dot")
      .classList.remove(
        "ok"
      );
  }


  $("period")
    .textContent =
    data.currentPeriod ||
    "—";


  $("next")
    .textContent =
    "NEXT PERIOD: " +
    (
      data.currentPeriod ||
      "—"
    );


  const latest =
    data.latestResult;

  if(latest){

    $("ball")
      .textContent =
      latest.number;

    $("number")
      .textContent =
      latest.number;

    $("type")
      .textContent =
      latest.result ||
      "—";

    const cls =
      latest.result === "BIG"
        ? "big"
        : latest.result === "SMALL"
          ? "small"
          : "";

    $("ball")
      .className =
      "ball " + cls;

    $("type")
      .className =
      "type " + cls;
  }


  const p =
    data.prediction || {};

  const value =
    p.result ||
    "WAIT";


  $("prediction")
    .textContent =
    value;

  $("prediction")
    .className =
    "prediction " +
    (
      value === "BIG"
        ? "big"
        : value === "SMALL"
          ? "small"
          : "wait"
    );


  $("target")
    .textContent =
    "TARGET PERIOD: " +
    (
      p.issue ||
      "—"
    );


  const confidence =
    Number(
      p.confidence || 0
    );


  $("confidence")
    .textContent =
    confidence +
    "%";


  $("fill")
    .style.width =
    Math.min(
      100,
      confidence
    ) +
    "%";


  let status =
    "WAITING FOR LIVE DATA...";


  if(
    p.status ===
    "ANALYZING"
  ){

    status =
      "AI ANALYSIS • " +
      (
        Number(
          p.analysis?.remaining ||
          0
        ) / 1000
      ).toFixed(1) +
      " SEC";

  }


  if(
    p.status ===
    "PREDICTED"
  ){

    status =
      "PREDICTION READY";

  }


  if(
    p.status ===
    "COOLDOWN"
  ){

    status =
      "SKIP MODE • NO ANALYSIS";

  }


  $("status")
    .textContent =
    status;


  const cycle =
    data.cycle || {};


  if(
    p.status ===
    "COOLDOWN"
  ){

    $("skip")
      .style.display =
      "block";

    $("skip")
      .textContent =
      "SKIP " +
      cycle.skipRound +
      " / " +
      cycle.skipTotal +
      " • " +
      cycle.skipRemaining +
      " LEFT";

  }else{

    $("skip")
      .style.display =
      "none";

  }


  const ai =
    data.ai || {};

  $("model")
    .textContent =
    ai.model || "—";

  $("quality")
    .textContent =
    ai.quality || "—";

  $("sample")
    .textContent =
    ai.sampleSize || 0;

  $("score")
    .textContent =
    ai.score ??
    "—";


  $("skipRound")
    .textContent =
    cycle.skipRound || 0;

  $("skipLeft")
    .textContent =
    cycle.skipRemaining || 0;


  const box =
    $("history");

  box.innerHTML = "";

  (
    data.recentResults ||
    []
  )
    .slice(0,10)
    .forEach(
      item => {

        const el =
          document.createElement(
            "div"
          );

        const cls =
          item.result === "BIG"
            ? "big"
            : item.result === "SMALL"
              ? "small"
              : "";

        el.className =
          "h " + cls;

        el.textContent =
          item.number;

        box.appendChild(
          el
        );

      }
    );

}


if(key){

  showApp();

}else{

  showLogin();

}


load();


setInterval(
  load,
  1000
);

</script>

</body>

</html>
