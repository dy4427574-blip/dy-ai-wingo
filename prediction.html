<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DY AI Wingo 30S</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 background:#070b16;
 color:#fff;
 font-family:Arial,sans-serif;
}

.container{
 max-width:520px;
 margin:auto;
 padding:16px;
}

.card{
 background:#10172a;
 border:1px solid #293657;
 border-radius:20px;
 padding:22px;
 margin:14px 0;
 box-shadow:0 12px 35px rgba(0,0,0,.35);
}

.login{
 margin-top:50px;
 text-align:center;
}

.logo{
 font-size:28px;
 font-weight:900;
 margin-bottom:8px;
}

.sub{
 color:#9aa7c4;
 margin-bottom:25px;
}

input{
 width:100%;
 padding:16px;
 border-radius:13px;
 border:1px solid #34405f;
 background:#0b1120;
 color:#fff;
 font-size:16px;
 outline:none;
}

button{
 width:100%;
 padding:16px;
 margin-top:12px;
 border:0;
 border-radius:13px;
 background:#635bff;
 color:#fff;
 font-size:16px;
 font-weight:900;
}

button:disabled{
 opacity:.6;
}

.msg{
 margin-top:15px;
 font-size:13px;
}

.error{color:#ff7285}
.success{color:#62e6a7}

.hidden{display:none}

.header{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.live{
 color:#62e6a7;
 font-size:12px;
 font-weight:900;
}

.label{
 text-align:center;
 color:#9aa7c4;
 font-size:12px;
 letter-spacing:1.5px;
}

.period{
 text-align:center;
}

.periodid{
 font-size:21px;
 margin:12px 0;
 letter-spacing:3px;
}

.timer{
 font-size:55px;
 font-weight:900;
 margin:5px 0 15px;
}

.bar{
 height:7px;
 background:#202b46;
 border-radius:20px;
 overflow:hidden;
}

.fill{
 height:100%;
 width:100%;
 background:#635bff;
 transition:width .3s linear;
}

.pred{
 text-align:center;
}

.prediction{
 font-size:58px;
 font-weight:900;
 margin:18px 0;
}

.conf{
 display:inline-block;
 background:#18233d;
 padding:9px 15px;
 border-radius:30px;
}

.number{
 font-size:25px;
 font-weight:900;
 margin-top:18px;
}

.status{
 text-align:center;
 color:#9aa7c4;
 font-size:13px;
}

.device{
 text-align:center;
 color:#667491;
 font-size:11px;
 margin-top:20px;
 word-break:break-all;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="loginBox" class="card login">

 <div class="logo">DY AI Wingo 30S</div>

 <div class="sub">
   Secure prediction access
 </div>

 <input
   id="key"
   type="text"
   placeholder="Enter prediction key"
   autocomplete="off"
 >

 <button id="loginBtn" onclick="login()">
   OPEN PREDICTION
 </button>

 <div id="message" class="msg"></div>

 <div class="device">
   Device ID:
   <span id="deviceText"></span>
 </div>

</div>


<!-- APP -->

<div id="app" class="hidden">

 <div class="card header">
   <div class="logo" style="font-size:22px">
     DY AI Wingo 30S
   </div>

   <div class="live">
     ● LIVE
   </div>
 </div>


 <div class="card period">

   <div class="label">
     CURRENT PERIOD
   </div>

   <div id="period" class="periodid">
     —
   </div>

   <div id="timer" class="timer">
     00:30
   </div>

   <div class="bar">
     <div id="fill" class="fill"></div>
   </div>

   <p id="serverStatus" class="status">
     Connecting...
   </p>

 </div>


 <div class="card pred">

   <div class="label">
     BIG / SMALL PREDICTION
   </div>

   <div id="prediction" class="prediction">
     —
   </div>

   <div id="confidence" class="conf">
     Waiting...
   </div>

   <div id="number" class="number">
     Number: —
   </div>

 </div>


 <div class="card">

   <div class="label">
     AUTO MODE
   </div>

   <p class="status">
     Server synchronized 30-second prediction system.
   </p>

 </div>

</div>

</div>


<script>

let accessKey="";
let deviceId="";
let endTime=0;
let lastPeriod="";


/* DEVICE ID */

function getDeviceId(){

 const saved=localStorage.getItem("dy_ai_device_id");

 if(saved){
   return saved;
 }

 const id=
   "DY-" +
   crypto.randomUUID();

 localStorage.setItem(
   "dy_ai_device_id",
   id
 );

 return id;
}

deviceId=getDeviceId();

document.getElementById("deviceText").textContent=
 deviceId.substring(0,24)+"...";


/* MESSAGE */

function message(text,type){

 const el=document.getElementById("message");

 el.textContent=text;
 el.className="msg "+type;
}


/* LOGIN */

async function login(){

 const key=
   document.getElementById("key")
   .value
   .trim();

 if(!key){

   message(
     "Please enter your prediction key.",
     "error"
   );

   return;
 }

 const btn=
   document.getElementById("loginBtn");

 btn.disabled=true;
 btn.textContent="CHECKING...";

 accessKey=key;

 try{

   const response=
     await fetch(
       "/api/state?device="+
       encodeURIComponent(deviceId),
       {
         method:"GET",
         cache:"no-store",
         headers:{
           "X-Access-Key":accessKey,
           "X-Device-ID":deviceId
         }
       }
     );

   const text=
     await response.text();

   let data={};

   try{
     data=JSON.parse(text);
   }catch{}

   if(!response.ok){

     throw new Error(
       data.error ||
       data.message ||
       "Invalid key"
     );

   }


   document
     .getElementById("loginBox")
     .classList
     .add("hidden");

   document
     .getElementById("app")
     .classList
     .remove("hidden");

   applyState(data);

   message(
     "Connected successfully.",
     "success"
   );

 }
 catch(error){

   message(
     "Login failed: "+error.message,
     "error"
   );

   btn.disabled=false;
   btn.textContent="OPEN PREDICTION";

 }

}


/* APPLY SERVER DATA */

function applyState(data){

 if(data.period !== undefined){

   lastPeriod=
     String(data.period);

   document.getElementById("period")
     .textContent=
     lastPeriod;

 }

 if(data.prediction !== undefined){

   document.getElementById("prediction")
     .textContent=
     data.prediction;

 }

 if(data.confidence !== undefined){

   document.getElementById("confidence")
     .textContent=
     "Confidence "+
     data.confidence+
     "%";

 }

 if(data.number !== undefined){

   document.getElementById("number")
     .textContent=
     "Number: "+
     data.number;

 }

 if(data.countdown !== undefined){

   endTime=
     Date.now()+
     Number(data.countdown)*1000;

 }

 document.getElementById("serverStatus")
   .textContent=
   "● Server synchronized";

}


/* SERVER SYNC */

async function sync(){

 if(!accessKey){
   return;
 }

 try{

   const response=
     await fetch(
       "/api/state?device="+
       encodeURIComponent(deviceId),
       {
         method:"GET",
         cache:"no-store",
         headers:{
           "X-Access-Key":accessKey,
           "X-Device-ID":deviceId
         }
       }
     );

   const text=
     await response.text();

   let data={};

   try{
     data=JSON.parse(text);
   }catch{}

   if(!response.ok){

     document.getElementById("serverStatus")
       .textContent=
       "● Access denied";

     return;

   }

   applyState(data);

 }
 catch(error){

   document.getElementById("serverStatus")
     .textContent=
     "● Connection lost — retrying";

 }

}


/* TIMER */

setInterval(function(){

 const app=
   document.getElementById("app");

 if(app.classList.contains("hidden")){
   return;
 }

 let remaining=
   Math.max(
     0,
     Math.ceil(
       (endTime-Date.now())/1000
     )
   );

 if(remaining>30){
   remaining=30;
 }

 document.getElementById("timer")
   .textContent=
   "00:"+
   String(remaining)
     .padStart(2,"0");

 document.getElementById("fill")
   .style.width=
   ((remaining/30)*100)+"%";

 if(remaining<=0){

   sync();

 }

},500);


/* BACKGROUND SYNC */

setInterval(function(){

 if(
   !document
     .getElementById("app")
     .classList
     .contains("hidden")
 ){

   sync();

 }

},5000);

</script>

</body>
</html>
