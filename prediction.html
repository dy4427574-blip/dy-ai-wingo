<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>DY AI WinGo</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#05070b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    padding:10px;
}

.container{
    width:100%;
    max-width:520px;
    margin:auto;
}

.card{
    background:#0d1118;
    border:1px solid #222a35;
    border-radius:18px;
    margin-bottom:10px;
}

/* LOGIN */
#login{
    margin-top:18vh;
    padding:22px;
}

#login h1{
    font-size:25px;
    margin-bottom:8px;
}

#login p{
    color:#7d8795;
    font-size:11px;
    margin-bottom:18px;
}

#accessKey{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #29313d;
    background:#070a0f;
    color:#fff;
    outline:none;
    font-size:14px;
}

#loginBtn{
    width:100%;
    margin-top:10px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#fff;
    color:#05070b;
    font-weight:900;
    cursor:pointer;
}

#error{
    display:none;
    margin-top:10px;
    padding:12px;
    border-radius:10px;
    background:#281117;
    color:#ff7082;
    font-size:11px;
}

/* APP */
#app{
    display:none;
}

.header{
    padding:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:12px;
    background:#fff;
    color:#05070b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:1000;
}

.title{
    font-size:16px;
    font-weight:900;
}

.sub{
    margin-top:3px;
    font-size:9px;
    color:#707b89;
}

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#555;
}

.dot.on{
    background:#35df88;
    box-shadow:0 0 12px #35df88;
}

/* GAME */
.game{
    height:220px;
    overflow:hidden;
}

.game iframe{
    width:100%;
    height:100%;
    border:0;
}

/* PREDICTION */
.prediction-card{
    padding:18px;
    text-align:center;
}

.label{
    color:#697482;
    font-size:9px;
    font-weight:900;
    letter-spacing:.8px;
}

.target{
    margin-top:6px;
    color:#8c96a3;
    font-size:11px;
}

.prediction{
    min-height:65px;
    margin-top:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    font-weight:1000;
}

.prediction.big{
    color:#ff9d4d;
}

.prediction.small{
    color:#4db8ff;
}

.prediction.thinking{
    color:#adb5c0;
    font-size:21px;
}

.prediction.none{
    color:#687281;
    font-size:21px;
}

.confidence{
    color:#8b95a2;
    font-size:10px;
}

.status{
    margin-top:8px;
    min-height:17px;
    color:#697482;
    font-size:9px;
}

/* RESULT */
.result{
    padding:13px;
}

.result-title{
    font-size:11px;
    font-weight:900;
    margin-bottom:10px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.stat{
    padding:10px;
    background:#090c11;
    border:1px solid #1b222b;
    border-radius:10px;
}

.stat span{
    display:block;
    color:#697482;
    font-size:8px;
}

.stat strong{
    display:block;
    margin-top:5px;
    font-size:12px;
}

.big{
    color:#ff9d4d;
}

.small{
    color:#4db8ff;
}

.win{
    color:#36df88;
}

.loss{
    color:#ff6578;
}

.wait{
    color:#697482;
}

/* HISTORY */
.history{
    padding:13px;
}

.history-head{
    display:flex;
    justify-content:space-between;
    margin-bottom:9px;
}

.history-title{
    font-size:11px;
    font-weight:900;
}

.last30{
    color:#697482;
    font-size:8px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:390px;
    border-collapse:collapse;
}

th{
    padding:8px;
    text-align:left;
    color:#626d7b;
    font-size:8px;
    border-bottom:1px solid #202630;
}

td{
    padding:9px 8px;
    font-size:9px;
    border-bottom:1px solid #151a21;
}

.footer{
    text-align:center;
    color:#424b57;
    font-size:8px;
    line-height:1.5;
    padding:12px;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="login" class="card">

    <h1>DY AI WinGo</h1>

    <p>
        Enter your access key to continue.
    </p>

    <input
        id="accessKey"
        type="text"
        placeholder="Enter access key"
        autocomplete="off"
    >

    <button id="loginBtn">
        ENTER AI
    </button>

    <div id="error"></div>

</div>


<!-- APP -->
<div id="app">

    <div class="card header">

        <div class="brand">

            <div class="logo">
                DY
            </div>

            <div>
                <div class="title">
                    DY AI WinGo
                </div>

                <div class="sub">
                    OWN FULL ANALYSIS V4
                </div>
            </div>

        </div>

        <div
            id="online"
            class="dot"
        ></div>

    </div>


    <!-- GAME -->
    <div class="card game">

        <iframe
            src="https://www.shreewin38.com/#/register?invitationCode=88523152383"
            allow="fullscreen"
        ></iframe>

    </div>


    <!-- PREDICTION -->
    <div class="card prediction-card">

        <div class="label">
            NEXT PREDICTION
        </div>

        <div
            id="target"
            class="target"
        >
            —
        </div>

        <div
            id="prediction"
            class="prediction none"
        >
            —
        </div>

        <div
            id="confidence"
            class="confidence"
        >
            Confidence —
        </div>

        <div
            id="status"
            class="status"
        >
            Connecting...
        </div>

    </div>


    <!-- RESULT -->
    <div class="card result">

        <div class="result-title">
            LIVE RESULT
        </div>

        <div class="stats">

            <div class="stat">
                <span>CURRENT ISSUE</span>
                <strong id="currentIssue">—</strong>
            </div>

            <div class="stat">
                <span>LAST NUMBER</span>
                <strong id="lastNumber">—</strong>
            </div>

            <div class="stat">
                <span>RESULT</span>
                <strong id="lastResult">—</strong>
            </div>

        </div>

    </div>


    <!-- HISTORY -->
    <div class="card history">

        <div class="history-head">

            <div class="history-title">
                LIVE HISTORY
            </div>

            <div class="last30">
                LAST 30
            </div>

        </div>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>ISSUE</th>
                        <th>NUMBER</th>
                        <th>RESULT</th>
                        <th>AI</th>
                        <th>W/L</th>
                    </tr>
                </thead>

                <tbody id="historyBody">

                    <tr>
                        <td colspan="5" class="wait">
                            Loading...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <div class="footer">
        Historical analysis only.<br>
        No prediction is guaranteed.
    </div>

</div>

</div>


<script>

const KEY_STORAGE =
    "dy_ai_access_key";

const DEVICE_STORAGE =
    "dy_ai_device_id";

const POLL_TIME =
    1000;


/* =====================================================
   DEVICE
===================================================== */

function getDeviceId(){

    let id =
        localStorage.getItem(
            DEVICE_STORAGE
        );

    if(!id){

        if(
            window.crypto &&
            crypto.randomUUID
        ){

            id =
                crypto.randomUUID();

        }else{

            id =
                "device-" +
                Math.random()
                    .toString(36)
                    .substring(2) +
                Date.now();
        }

        localStorage.setItem(
            DEVICE_STORAGE,
            id
        );
    }

    return id;
}


const deviceId =
    getDeviceId();


/* =====================================================
   ELEMENTS
===================================================== */

const login =
    document.getElementById(
        "login"
    );

const app =
    document.getElementById(
        "app"
    );

const accessKey =
    document.getElementById(
        "accessKey"
    );

const loginBtn =
    document.getElementById(
        "loginBtn"
    );

const errorBox =
    document.getElementById(
        "error"
    );

const online =
    document.getElementById(
        "online"
    );

const target =
    document.getElementById(
        "target"
    );

const prediction =
    document.getElementById(
        "prediction"
    );

const confidence =
    document.getElementById(
        "confidence"
    );

const status =
    document.getElementById(
        "status"
    );

const currentIssue =
    document.getElementById(
        "currentIssue"
    );

const lastNumber =
    document.getElementById(
        "lastNumber"
    );

const lastResult =
    document.getElementById(
        "lastResult"
    );

const historyBody =
    document.getElementById(
        "historyBody"
    );


let key =
    localStorage.getItem(
        KEY_STORAGE
    ) || "";


/* =====================================================
   LOGIN
===================================================== */

async function loginAI(){

    const entered =
        accessKey.value.trim();

    if(!entered){

        showError(
            "Access key required."
        );

        return;
    }

    loginBtn.disabled =
        true;

    loginBtn.textContent =
        "CHECKING...";

    try{

        const response =
            await fetch(
                "/api/key/check?_=" +
                Date.now(),
                {
                    method:"GET",

                    headers:{
                        "X-Access-Key":
                            entered,

                        "X-Device-Id":
                            deviceId
                    },

                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.ok
        ){

            throw new Error(
                data.error ||
                "Invalid access key or device."
            );
        }


        key =
            entered;


        localStorage.setItem(
            KEY_STORAGE,
            key
        );


        errorBox.style.display =
            "none";

        login.style.display =
            "none";

        app.style.display =
            "block";


        startPolling();

    }catch(error){

        showError(
            error.message
        );

    }finally{

        loginBtn.disabled =
            false;

        loginBtn.textContent =
            "ENTER AI";
    }
}


function showError(
    message
){

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";
}


loginBtn.addEventListener(
    "click",
    loginAI
);


accessKey.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Enter"
        ){

            loginAI();
        }
    }
);


/* =====================================================
   GET STATE
===================================================== */

async function getState(){

    if(!key){
        return;
    }


    try{

        const response =
            await fetch(
                "/api/state?_=" +
                Date.now(),
                {
                    method:"GET",

                    headers:{
                        "X-Access-Key":
                            key,

                        "X-Device-Id":
                            deviceId
                    },

                    cache:"no-store"
                }
            );


        if(
            response.status === 401
        ){

            localStorage.removeItem(
                KEY_STORAGE
            );

            key = "";

            location.reload();

            return;
        }


        const data =
            await response.json();


        if(!data.ok){
            return;
        }


        renderState(
            data
        );


    }catch(error){

        online.classList.remove(
            "on"
        );

        status.textContent =
            "Reconnecting...";
    }
}


/* =====================================================
   RENDER
===================================================== */

let previousTarget =
    null;

let thinkingTarget =
    null;

function renderState(
    data
){

    online.classList.add(
        "on"
    );


    currentIssue.textContent =
        data.currentIssue ||
        "—";


    const model =
        data.model || {};


    const newTarget =
        model.targetIssue;


    /*
      New prediction target:
      show 3-second analysis animation
    */

    if(
        newTarget &&
        newTarget !== previousTarget
    ){

        previousTarget =
            newTarget;

        thinkingTarget =
            newTarget;

        showThinking();

        setTimeout(
            function(){

                /*
                  Only replace if the
                  same target is still active.
                */

                if(
                    thinkingTarget ===
                    newTarget
                ){

                    showPrediction(
                        model
                    );
                }

            },
            3000
        );

    }else{

        /*
          Normal fast update
        */

        if(
            model.prediction
        ){

            showPrediction(
                model
            );
        }
    }


    renderLatestResult(
        data.history || []
    );


    renderHistory(
        data.history || [],
        model.lastPrediction
    );
}


/* =====================================================
   THINKING
===================================================== */

function showThinking(){

    prediction.className =
        "prediction thinking";

    prediction.innerHTML =
        `
        ANALYSING
        <span>...</span>
        `;

    confidence.textContent =
        "Confidence —";

    status.textContent =
        "Full AI analysis...";
}


/* =====================================================
   SHOW PREDICTION
===================================================== */

function showPrediction(
    model
){

    if(
        !model.prediction
    ){

        prediction.className =
            "prediction none";

        prediction.textContent =
            "ANALYSING";

        confidence.textContent =
            "Confidence —";

        status.textContent =
            "Waiting for analysis...";

        return;
    }


    const p =
        String(
            model.prediction
        ).toUpperCase();


    prediction.className =
        "prediction " +
        (
            p === "BIG"
                ? "big"
                : "small"
        );


    prediction.textContent =
        p;


    target.textContent =
        "Target Issue: " +
        (
            model.targetIssue ||
            "—"
        );


    confidence.textContent =
        "Confidence " +
        Number(
            model.confidence || 0
        ) +
        "%";


    status.textContent =
        model.analysis?.classification ||
        "AI ANALYSIS READY";
}


/* =====================================================
   LATEST RESULT
===================================================== */

function renderLatestResult(
    history
){

    if(
        !history.length
    ){
        return;
    }


    const row =
        history[0];


    lastNumber.textContent =
        row.number ??
        "—";


    lastResult.textContent =
        row.result ||
        "—";


    lastResult.className =
        row.result === "BIG"
            ? "big"
            : "small";
}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory(
    history,
    lastPrediction
){

    if(
        !history.length
    ){

        historyBody.innerHTML =
            `
            <tr>
                <td
                    colspan="5"
                    class="wait"
                >
                    No history.
                </td>
            </tr>
            `;

        return;
    }


    historyBody.innerHTML =
        history.map(
            row => {

                let ai =
                    "—";

                let wl =
                    "—";


                if(
                    lastPrediction &&
                    String(
                        lastPrediction.target_issue
                    ) ===
                    String(
                        row.issue
                    )
                ){

                    ai =
                        lastPrediction.prediction ||
                        "—";

                    wl =
                        lastPrediction.actual_result ||
                        "—";
                }


                const resultClass =
                    row.result === "BIG"
                        ? "big"
                        : "small";


                const aiClass =
                    ai === "BIG"
                        ? "big"
                        : ai === "SMALL"
                            ? "small"
                            : "wait";


                const wlClass =
                    wl === "WIN"
                        ? "win"
                        : wl === "LOSS"
                            ? "loss"
                            : "wait";


                return `
                <tr>

                    <td>
                        ${escapeHTML(
                            row.issue
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            row.number
                        )}
                    </td>

                    <td class="${resultClass}">
                        ${escapeHTML(
                            row.result
                        )}
                    </td>

                    <td class="${aiClass}">
                        ${escapeHTML(
                            ai
                        )}
                    </td>

                    <td class="${wlClass}">
                        ${escapeHTML(
                            wl
                        )}
                    </td>

                </tr>
                `;
            }
        ).join("");
}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


/* =====================================================
   POLLING
===================================================== */

let pollTimer =
    null;

let busy =
    false;


async function startPolling(){

    await getState();


    if(pollTimer){

        clearInterval(
            pollTimer
        );
    }


    pollTimer =
        setInterval(
            async function(){

                if(busy){
                    return;
                }

                busy = true;

                try{
                    await getState();
                }finally{
                    busy = false;
                }

            },
            POLL_TIME
        );
}


/* =====================================================
   AUTO LOGIN
===================================================== */

if(key){

    (async function(){

        try{

            const response =
                await fetch(
                    "/api/key/check?_=" +
                    Date.now(),
                    {
                        headers:{
                            "X-Access-Key":
                                key,

                            "X-Device-Id":
                                deviceId
                        },

                        cache:"no-store"
                    }
                );


            const data =
                await response.json();


            if(
                response.ok &&
                data.ok
            ){

                login.style.display =
                    "none";

                app.style.display =
                    "block";

                startPolling();

            }else{

                localStorage.removeItem(
                    KEY_STORAGE
                );

                key = "";
            }

        }catch{

            /*
              Server unavailable:
              login screen remains.
            */
        }

    })();
}

</script>

</body>
</html>
