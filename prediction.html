<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DY AI • Wingo 1 Minute</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top,#172746,#070910 48%,#030408);
  color:#fff;
}

.wrap{
  width:min(650px,94%);
  margin:auto;
  padding:18px 0 35px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:17px 19px;
  border-radius:20px;
  background:rgba(12,18,30,.92);
  border:1px solid rgba(255,255,255,.09);
}

.logo{
  font-size:23px;
  font-weight:900;
}

.logo span{
  color:#00eaff;
}

.api{
  display:flex;
  align-items:center;
  gap:7px;
  color:#8f9caf;
  font-size:11px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#ff526b;
}

.dot.on{
  background:#19e58b;
  box-shadow:0 0 12px #19e58b;
}

.prediction{
  margin-top:18px;
  padding:27px 20px;
  text-align:center;
  border-radius:23px;
  background:
    linear-gradient(145deg,
      rgba(18,40,70,.97),
      rgba(9,14,25,.98));
  border:1px solid rgba(0,234,255,.18);
  box-shadow:0 15px 45px rgba(0,0,0,.3);
}

.small-title{
  color:#75dfff;
  font-size:11px;
  font-weight:800;
  letter-spacing:2px;
}

.prediction h1{
  margin-top:9px;
  font-size:15px;
  color:#9ba8bb;
  font-weight:600;
}

.result{
  margin-top:13px;
  font-size:44px;
  font-weight:1000;
  letter-spacing:1px;
}

.result.big{
  color:#ff7188;
  text-shadow:0 0 25px rgba(255,113,136,.25);
}

.result.small{
  color:#51ddff;
  text-shadow:0 0 25px rgba(81,221,255,.25);
}

.result.wait{
  color:#aab4c5;
  font-size:30px;
}

.period{
  margin-top:9px;
  color:#77859b;
  font-size:11px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.history{
  margin-top:18px;
  padding:20px;
  border-radius:22px;
  background:rgba(9,14,24,.94);
  border:1px solid rgba(255,255,255,.08);
}

.history-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.history-title h2{
  font-size:18px;
}

.live-text{
  font-size:10px;
  color:#19e58b;
  font-weight:800;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px 8px;
  border-bottom:1px solid rgba(255,255,255,.07);
  text-align:left;
  font-size:12px;
}

th{
  color:#718097;
  font-size:9px;
  text-transform:uppercase;
}

td:first-child{
  color:#6f7c91;
}

.number{
  font-size:18px;
  font-weight:900;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  font-size:9px;
  font-weight:900;
}

.badge.big{
  color:#ff7b91;
  background:rgba(255,113,136,.12);
}

.badge.small{
  color:#55ddff;
  background:rgba(81,221,255,.12);
}

.empty{
  padding:25px 5px;
  text-align:center;
  color:#6e7b90;
  font-size:12px;
}

.error{
  margin-top:10px;
  color:#ff7188;
  font-size:11px;
}

@media(max-width:450px){

  .wrap{
    width:93%;
  }

  .result{
    font-size:38px;
  }

  th,td{
    padding:11px 5px;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <!-- HEADER -->

  <div class="header">

    <div class="logo">
      DY <span>AI</span>
    </div>

    <div class="api">
      <span id="dot" class="dot"></span>
      <span id="apiText">CONNECTING</span>
    </div>

  </div>


  <!-- ONLY PREDICTION -->

  <section class="prediction">

    <div class="small-title">
      WINGO 1 MINUTE
    </div>

    <h1>
      NEXT ROUND
    </h1>

    <div
      id="prediction"
      class="result wait">
      ANALYZING...
    </div>

    <div
      id="period"
      class="period">
      —
    </div>

    <div
      id="error"
      class="error">
    </div>

  </section>


  <!-- ONLY HISTORY -->

  <section class="history">

    <div class="history-title">

      <h2>
        History
      </h2>

      <span class="live-text">
        ● LIVE
      </span>

    </div>

    <table>

      <thead>

        <tr>
          <th>#</th>
          <th>Period</th>
          <th>Number</th>
          <th>Size</th>
        </tr>

      </thead>

      <tbody id="historyBody">

      </tbody>

    </table>

    <div
      id="empty"
      class="empty">
      Loading history...
    </div>

  </section>

</div>


<script>

/* =====================================================
   SETTINGS
===================================================== */

const SAMPLE_SIZE = 20;


/* =====================================================
   ELEMENTS
===================================================== */

const $ = id =>
  document.getElementById(id);


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData(){

  try{

    const response =
      await fetch(
        "/api/history?time=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.error ||
        "API error"
      );

    }

    const history =
      Array.isArray(data.history)
        ? data.history
        : [];

    if(!history.length){

      throw new Error(
        "No history received"
      );

    }

    $("dot")
      .classList
      .add("on");

    $("apiText")
      .textContent = "LIVE";

    $("error")
      .textContent = "";

    renderHistory(history);

    calculatePrediction(history);

  }
  catch(error){

    console.error(error);

    $("dot")
      .classList
      .remove("on");

    $("apiText")
      .textContent = "OFFLINE";

    $("prediction")
      .textContent =
      "WAITING";

    $("prediction")
      .className =
      "result wait";

    $("error")
      .textContent =
      "Live data unavailable.";

  }

}


/* =====================================================
   CONVERT NUMBER
===================================================== */

function getSize(number){

  const n =
    Number(number);

  if(
    !Number.isFinite(n)
  ){

    return null;

  }

  return n <= 4
    ? "SMALL"
    : "BIG";

}


/* =====================================================
   NORMALIZE HISTORY
===================================================== */

function normalize(history){

  return history
    .map(item => {

      const number =
        Number(item.number);

      const size =
        item.size ||
        getSize(number);

      return {
        issueNumber:
          item.issueNumber ??
          item.period ??
          "—",

        number,

        size
      };

    })
    .filter(
      x =>
        Number.isFinite(x.number) &&
        (
          x.size === "BIG" ||
          x.size === "SMALL"
        )
    );

}


/* =====================================================
   MULTI-FACTOR ANALYSIS
===================================================== */

function calculatePrediction(rawHistory){

  const history =
    normalize(rawHistory)
      .slice(0,SAMPLE_SIZE);


  if(history.length < 8){

    setPrediction(
      "WAITING",
      null
    );

    $("period").textContent =
      history[0]?.issueNumber ||
      "—";

    return;

  }


  /*
   * IMPORTANT:
   *
   * This does NOT simply say:
   * BIG count > SMALL count = BIG.
   *
   * Several sequence structures are examined.
   */


  let bigScore = 0;
  let smallScore = 0;


  /* ---------------------------------------------------
     1. VERY RECENT WINDOW
  --------------------------------------------------- */

  const recent =
    history.slice(0,5);


  /*
   * Recency-weighted sequence.
   */

  recent.forEach(
    (item,index)=>{

      const weight =
        5 - index;

      if(item.size === "BIG"){

        bigScore += weight;

      }else{

        smallScore += weight;

      }

    }
  );


  /* ---------------------------------------------------
     2. ALTERNATION DETECTION
  --------------------------------------------------- */

  const altLength =
    alternatingLength(history);


  if(altLength >= 5){

    /*
     * If the latest sequence is strongly alternating,
     * continue the detected alternating structure
     * as one analysis signal.
     */

    const last =
      history[0].size;

    const previous =
      history[1]?.size;

    if(
      last &&
      previous &&
      last !== previous
    ){

      /*
       * Current sequence is alternating.
       * The next member of a strict alternation
       * would be opposite to the latest.
       */

      if(last === "BIG"){

        smallScore += 8;

      }else{

        bigScore += 8;

      }

    }

  }


  /* ---------------------------------------------------
     3. STREAK STRUCTURE
  --------------------------------------------------- */

  const streak =
    getStreak(history);


  if(streak.length >= 3){

    /*
     * Long streak is treated as a pattern signal,
     * but NOT as an automatic opposite prediction.
     */

    if(streak.side === "BIG"){

      bigScore +=
        Math.min(
          streak.length * 1.2,
          6
        );

    }else{

      smallScore +=
        Math.min(
          streak.length * 1.2,
          6
        );

    }

  }


  /* ---------------------------------------------------
     4. STREAK BREAK STRUCTURE
  --------------------------------------------------- */

  const breakSignal =
    detectBreak(history);


  if(breakSignal){

    if(
      breakSignal === "BIG"
    ){

      bigScore += 5;

    }else{

      smallScore += 5;

    }

  }


  /* ---------------------------------------------------
     5. LAST 3/4 PATTERN MATCH
  --------------------------------------------------- */

  const patternSignal =
    findRepeatedPattern(history);


  if(patternSignal){

    if(
      patternSignal === "BIG"
    ){

      bigScore += 7;

    }else{

      smallScore += 7;

    }

  }


  /* ---------------------------------------------------
     6. NUMBER-LEVEL STRUCTURE
  --------------------------------------------------- */

  const numberSignal =
    digitStructure(history);


  if(numberSignal){

    if(
      numberSignal === "BIG"
    ){

      bigScore += 4;

    }else{

      smallScore += 4;

    }

  }


  /* ---------------------------------------------------
     7. SHORT VS LONG STRUCTURE
  --------------------------------------------------- */

  const shortSignal =
    windowSignal(
      history.slice(0,5)
    );

  const longSignal =
    windowSignal(
      history.slice(0,10)
    );


  /*
   * Only add if the signals agree.
   * This prevents a single majority count
   * from controlling the result.
   */

  if(
    shortSignal &&
    shortSignal === longSignal
  ){

    if(shortSignal === "BIG"){

      bigScore += 5;

    }else{

      smallScore += 5;

    }

  }


  /* ---------------------------------------------------
     FINAL DECISION
  --------------------------------------------------- */

  const difference =
    Math.abs(
      bigScore -
      smallScore
    );


  /*
   * If signals are almost equal,
   * don't force a direction.
   */

  if(
    difference < 3
  ){

    setPrediction(
      "NO CLEAR SIGNAL",
      history[0]?.issueNumber
    );

    return;

  }


  const result =
    bigScore > smallScore
      ? "BIG"
      : "SMALL";


  setPrediction(
    result,
    history[0]?.issueNumber
  );

}


/* =====================================================
   ALTERNATION LENGTH
===================================================== */

function alternatingLength(history){

  if(history.length < 2){

    return 1;

  }

  let length = 1;


  for(
    let i = 1;
    i < history.length;
    i++
  ){

    if(
      history[i].size !==
      history[i-1].size
    ){

      length++;

    }else{

      break;

    }

  }


  return length;

}


/* =====================================================
   STREAK
===================================================== */

function getStreak(history){

  if(!history.length){

    return {
      side:null,
      length:0
    };

  }


  const side =
    history[0].size;


  let length = 0;


  for(
    const item
    of history
  ){

    if(item.size === side){

      length++;

    }else{

      break;

    }

  }


  return {
    side,
    length
  };

}


/* =====================================================
   BREAK DETECTION
===================================================== */

function detectBreak(history){

  if(history.length < 5){

    return null;

  }


  const latest =
    history[0].size;


  const previous =
    history[1].size;


  if(latest === previous){

    return null;

  }


  let oldStreak = 0;


  for(
    let i = 1;
    i < history.length;
    i++
  ){

    if(
      history[i].size ===
      previous
    ){

      oldStreak++;

    }else{

      break;

    }

  }


  if(oldStreak >= 3){

    return latest;

  }


  return null;

}


/* =====================================================
   REPEATED PATTERN
===================================================== */

function findRepeatedPattern(history){

  if(history.length < 8){

    return null;

  }


  /*
   * Look for a previous 3-result pattern
   * and inspect what followed it.
   */

  const current =
    history
      .slice(0,3)
      .map(x => x.size)
      .join("-");


  for(
    let i = 3;
    i <= history.length - 4;
    i++
  ){

    const oldPattern =
      history
        .slice(i,i+3)
        .map(x => x.size)
        .join("-");


    if(
      oldPattern === current
    ){

      const next =
        history[i-1]?.size;


      if(
        next === "BIG" ||
        next === "SMALL"
      ){

        return next;

      }

    }

  }


  return null;

}


/* =====================================================
   DIGIT STRUCTURE
===================================================== */

function digitStructure(history){

  if(history.length < 5){

    return null;

  }


  const recent =
    history.slice(0,5);


  /*
   * Check parity-like grouping around the
   * BIG/SMALL boundary without using simple
   * total frequency.
   */

  let highBig = 0;
  let lowSmall = 0;


  recent.forEach(item => {

    if(
      item.number >= 7
    ){

      highBig++;

    }


    if(
      item.number <= 2
    ){

      lowSmall++;

    }

  });


  if(
    highBig >= 3 &&
    lowSmall <= 1
  ){

    return "BIG";

  }


  if(
    lowSmall >= 3 &&
    highBig <= 1
  ){

    return "SMALL";

  }


  return null;

}


/* =====================================================
   WINDOW SIGNAL
===================================================== */

function windowSignal(history){

  if(!history.length){

    return null;

  }


  let score = 0;


  history.forEach(
    (item,index)=>{

      const weight =
        history.length - index;

      if(item.size === "BIG"){

        score += weight;

      }else{

        score -= weight;

      }

    }
  );


  /*
   * Return null when the window itself is
   * too balanced. This stops simple majority
   * from dominating.
   */

  if(
    Math.abs(score) <
    history.length * 1.5
  ){

    return null;

  }


  return score > 0
    ? "BIG"
    : "SMALL";

}


/* =====================================================
   SET PREDICTION
===================================================== */

function setPrediction(
  result,
  period
){

  const el =
    $("prediction");


  el.textContent =
    result;


  el.className =
    "result " +
    (
      result === "BIG"
        ? "big"
        : result === "SMALL"
          ? "small"
          : "wait"
    );


  $("period").textContent =
    period || "—";

}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory(rawHistory){

  const history =
    normalize(rawHistory)
      .slice(0,20);


  const body =
    $("historyBody");


  body.innerHTML = "";


  if(!history.length){

    $("empty").style.display =
      "block";

    $("empty").textContent =
      "No history available.";

    return;

  }


  $("empty").style.display =
    "none";


  history.forEach(
    (item,index)=>{

      const tr =
        document.createElement("tr");


      const cls =
        item.size === "BIG"
          ? "big"
          : "small";


      tr.innerHTML = `

        <td>
          ${index + 1}
        </td>

        <td>
          ${escapeHtml(
            item.issueNumber
          )}
        </td>

        <td class="number">
          ${item.number}
        </td>

        <td>
          <span class="badge ${cls}">
            ${item.size}
          </span>
        </td>

      `;


      body.appendChild(tr);

    }
  );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   START
===================================================== */

loadData();


/*
 * Refresh every 15 seconds.
 */

setInterval(
  loadData,
  15000
);

</script>

</body>
</html>
